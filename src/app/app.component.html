<p-toast position="top-center" [breakpoints]="{'576px': {width: '100%', right: '0', left: '0', bottom: '0', top: 'auto', 'border-radius': '0'}}" />
@if (!isPopup) {
  <app-titlebar />
  <app-call-overlay />
}
<main [class]="isPopup ? 'w-full h-full' : 'flex-1 min-h-0'">
  <router-outlet />
</main>
@if (!isPopup) {
  <app-update-dialog />
}
