<!-- Tagged because this is where sign-in and verification failures actually surface. Neither form
     has an inline error node, so the negative-path tests have nothing else to assert against. It
     carries every toast in the app, so a test must match on the message text, not on this alone. -->
<p-toast data-testid="toast" position="top-center"/>
@if (!isPopup) {
    <app-resize-handles/>
    <app-titlebar/>
    <app-status-banner/>
    <app-call-overlay/>
    <app-screen-picker/>
    <app-isle-proximity-bar/>
}
<main [class]="isPopup ? 'w-full h-full' : 'flex-1 min-h-0'">
    <router-outlet/>
</main>
@if (!isPopup) {
    <app-update-dialog/>
    <app-legal-consent-dialog/>
    <app-email-verification-dialog/>
    <app-mfa-challenge-dialog/>
    <app-password-reset-dialog/>
    <app-invite-dialog/>
    <app-bot-install-dialog/>
    <app-discord-import-progress-dialog/>
    <app-bot-command-dialog/>
    <app-bot-modal-dialog/>
}
