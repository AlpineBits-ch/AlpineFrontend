<!-- Tagged because this is where sign-in and verification failures actually surface. Neither form
     has an inline error node, so the negative-path tests have nothing else to assert against. It
     carries every toast in the app, so a test must match on the message text, not on this alone. -->
<p-toast data-testid="toast" position="top-center"/>
@if (!isPopup) {
    <app-resize-handles/>
    <app-titlebar/>
    <app-status-banner/>
    <app-call-overlay/>
    <!--
      Voice-channel rings. Global, because a ring can arrive from any guild while the user is
      anywhere - but inline and in a corner rather than fullscreen: nobody is on the line waiting,
      so it is a notification, not a call. See VoiceRingCardComponent.
    -->
    <div class="pointer-events-none fixed bottom-4 right-4 z-[1200]">
        <app-voice-ring-card/>
    </div>
    <!-- Both call stages are part of the view they live in, so navigating away unmounts them while
         the session keeps running. This is the tile that keeps the picture. It lives here, above
         the router outlet, because that is the only place either stage cannot reach. -->
    <app-call-mini-player/>
    <app-screen-picker/>
    <app-isle-proximity-bar/>
}
<main [class]="isPopup ? 'w-full h-full' : 'flex-1 min-h-0'">
    <router-outlet/>
</main>
@if (!isPopup) {
    <app-update-dialog/>
    <app-legal-consent-dialog/>
    <app-email-verification-dialog/>
    <app-mfa-challenge-dialog/>
    <app-password-reset-dialog/>
    <app-invite-dialog/>
    <app-bot-install-dialog/>
    <app-discord-import-progress-dialog/>
    <app-bot-command-dialog/>
    <app-bot-modal-dialog/>
}
