<app-profile-header
        (avatarClick)="avatarClick.emit()"
        (avatarErrorChange)="avatarErrorChange.emit()"
        [avatarError]="avatarError()"
        [profile]="profile()"/>

@if (profile(); as p) {
    <div class="px-4 pb-4 pt-3">

        <!--
          Rich presence, above the "Member Since" facts and separated from them.

          Its own divider because it is a different kind of statement: everything below is
          biography and does not change while the card is open, and this is live and does. One
          card per activity - the server caps the list at three.
        -->
        @for (activity of activities(); track activity.name) {
            <app-activity-card [activity]="activity"/>
            <div class="border-t border-border-subtle my-3"></div>
        }

        <div class="flex flex-col gap-2.5">
            <div class="flex flex-col gap-0.5">
                <span class="text-[10px] font-semibold tracking-widest uppercase text-text-muted">Member Since</span>
                <span class="text-sm text-text-secondary">{{ p.createdAt | date:'MMM d, yyyy' }}</span>
            </div>
            @if (friendsSince()) {
                <div class="flex flex-col gap-0.5">
                    <span class="text-[10px] font-semibold tracking-widest uppercase text-text-muted">Friends Since</span>
                    <span class="text-sm text-text-secondary">{{ friendsSince() | date:'MMM d, yyyy' }}</span>
                </div>
            }
        </div>

    </div>
}
