@if (profile(); as p) {
    <div class="relative">
        <!-- Banner -->
        <div [style.background]="!bannerUrl() ? safeAccentColor(p.accentColor) : null" class="profile-banner">
            @if (bannerUrl(); as url) {
                <img (error)="onBannerError()" [src]="url" alt="" class="profile-banner-img" />
            }
        </div>

        <!-- Avatar (overlapping banner/body boundary) -->
        <div class="absolute left-4 z-10" style="top: 56px">
            <div (click)="onAvatarClick()" [class.cursor-pointer]="p.avatarUrl && !avatarError()" class="relative">
                @if (p.avatarUrl && !avatarError()) {
                    <img
                        (error)="onAvatarError()"
                        [src]="p.avatarUrl"
                        alt="Profile avatar"
                        class="w-[88px] h-[88px] rounded-full object-cover ring-[3px] ring-card transition-opacity hover:opacity-90"
                    />
                } @else {
                    <div
                        [style.background]="safeAccentColor(p.accentColor)"
                        [class.bg-brand]="!safeAccentColor(p.accentColor)"
                        class="w-[88px] h-[88px] rounded-full ring-[3px] ring-card flex items-center justify-center text-2xl font-bold text-white select-none"
                    >
                        {{ avatarLabel() }}
                    </div>
                }
                <app-user-status-dot [status]="p.onlineStatus" borderColor="border-card" size="lg" />
            </div>
        </div>

        <!-- Name and bio -->
        <div class="px-4" style="padding-top: 56px">
            <h2 [appUserNameStyle]="p" class="text-[17px] font-bold leading-tight text-text-primary mb-1">
                {{ p.userName }}
            </h2>

            @if (p.bio) {
                <p class="text-sm text-text-secondary leading-snug">{{ p.bio }}</p>
            }
        </div>
    </div>
} @else {
    <!-- Loading skeleton -->
    <div class="relative">
        <div class="profile-banner"></div>
        <div class="px-4" style="padding-top: 56px">
            <div class="h-4 w-36 bg-white/[0.08] rounded-md animate-pulse mb-2 mt-1"></div>
            <div class="h-3 w-24 bg-white/[0.05] rounded-md animate-pulse"></div>
        </div>
    </div>
}
