<div class="flex flex-col items-center gap-3">
  <canvas
    #cropCanvas
    width="320"
    height="320"
    class="rounded-xl cursor-grab active:cursor-grabbing touch-none select-none block"
    style="background: #0d1117;"
    (mousedown)="onMouseDown($event)"
    (mousemove)="onMouseMove($event)"
    (mouseup)="onMouseUp()"
    (mouseleave)="onMouseUp()"
    (touchstart)="onTouchStart($event)"
    (touchend)="onTouchEnd()">
  </canvas>
  <p class="text-xs text-white/35 self-start">Drag to reposition · Scroll or pinch to zoom</p>
  <div class="flex gap-3 w-full justify-end pt-1">
    <p-button label="Cancel" severity="secondary" size="small" (onClick)="cancelled.emit()" />
    <p-button label="Apply" severity="primary" size="small" (onClick)="confirmCrop()" />
  </div>
</div>
