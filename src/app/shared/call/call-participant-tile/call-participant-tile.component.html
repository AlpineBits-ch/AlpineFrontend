@let p = participant();

<!-- One aspect ratio whether the camera is on or off.

     It used to be 4/3 and capped at 12.5rem with the camera off, 16/9 and full width with it on -
     so switching your camera on resized your tile and reflowed the whole grid, and any call with a
     mix of the two was ragged rows of two different shapes. The tile is a seat in the call; what
     is drawn inside it is the part that varies. -->
<div
    #root
    (contextmenu)="contextMenu.emit($event); $event.preventDefault(); $event.stopPropagation()"
    [class]="
        'group relative flex aspect-video w-full flex-col items-center justify-center overflow-hidden ' +
        'rounded-2xl border transition-colors ' +
        (p.isCameraOn ? 'bg-black ' : 'bg-card ') +
        (p.isSpeaking ? 'border-online/60 speaking-ring' : 'border-border-subtle')
    "
>
    <!-- Camera, filling the tile.

         It used to be a 64px circle in the middle of an otherwise empty card - the same treatment
         an avatar gets - which is a thumbnail of a person, not a video call. It fills the tile and
         everything else floats on top of it, which is what every other client does and what the
         face-sized space is for. -->
    @if (p.isCameraOn) {
        @if (videoStream(); as stream) {
            <video
                #video
                [class.-scale-x-100]="p.isLocal"
                [muted]="p.isLocal"
                [streamSrc]="stream"
                autoplay
                class="absolute inset-0 h-full w-full object-cover"
                playsinline
            ></video>
        } @else {
            <!-- Camera on, no stream yet: the track is still being negotiated. -->
            <div class="absolute inset-0 flex items-center justify-center bg-card">
                <i [attr.aria-label]="'CALL.CAMERA_ON' | translate" class="pi pi-camera text-2xl text-white/20"></i>
            </div>
        }
    } @else {
        <app-avatar [label]="p.avatarLabel" [userId]="p.userId" size="large" />
    }

    @if (p.isScreenSharing) {
        <app-call-live-badge class="absolute right-3 top-3 z-20" />
    }

    <!-- Video actions. Hover-only, so a wall of tiles is faces rather than buttons. -->
    @if (p.isCameraOn && videoStream()) {
        <div
            class="absolute left-3 top-3 z-20 flex items-center gap-1.5 opacity-0 transition-opacity group-hover:opacity-100 focus-within:opacity-100"
        >
            @if (canPip()) {
                <app-call-tile-action
                    (action)="togglePip()"
                    [label]="'CALL.PICTURE_IN_PICTURE' | translate"
                    icon="pi-external-link"
                    size="sm"
                />
            }
            <app-call-tile-action
                (action)="toggleFullscreen()"
                [label]="'CALL.FULLSCREEN' | translate"
                icon="pi-window-maximize"
                size="sm"
            />
        </div>
    }

    <!-- Name + muted icon: a pill in the bottom-left corner, camera on or off.

         It used to be `mt-3` centred text under the avatar with the camera off, sharing the tile's
         flex column with it - so the two formed a stack pushed above true centre by half the name's
         height, and a one-person tile read as off-balance rather than centred. Absolute positioning
         unconditionally takes the name out of that column: the avatar is then the column's only
         child, and `items-center justify-center` on the root centres it on its own. -->
    <div
        class="absolute bottom-2 left-2 z-20 flex max-w-[calc(100%-1rem)] items-center justify-center gap-1.5 rounded-lg bg-black/50 px-2 py-1 backdrop-blur-sm"
    >
        @if (p.isMuted) {
            <!-- Drawn slash - PrimeIcons has no slashed microphone, see .icon-slashed. -->
            <span
                [attr.aria-label]="'CALL.MUTED' | translate"
                class="icon-slashed relative flex shrink-0 items-center justify-center text-xs text-offline"
            >
                <i class="pi pi-microphone"></i>
            </span>
        }
        <span class="truncate text-sm font-medium text-white/85">{{ p.displayName }}</span>
    </div>

    <!-- Audio badge: quiet while the subscribe is still landing, amber once it is overdue -->
    @if (!p.isLocal) {
        <app-call-audio-status [state]="audioState()" class="absolute bottom-3 right-3 z-20" />
    }
</div>
