<div class="shrink-0 bg-black/60 backdrop-blur-xl border border-white/10 rounded-2xl shadow-[0_8px_32px_rgba(0,0,0,0.5)] px-4 py-4 flex items-center justify-center gap-3">

    <!-- Mute -->
    <button
            (click)="muteToggle.emit()"
            [ngClass]="isMuted()
      ? 'bg-rose-500/20 text-rose-400 hover:bg-rose-500/30'
      : 'bg-white/[0.07] text-white/60 hover:bg-white/[0.12] hover:text-white/80'"
            [title]="isMuted() ? 'Unmute' : 'Mute'"
            class="group w-12 h-12 rounded-xl flex items-center justify-center transition-all duration-150 active:scale-95 cursor-pointer border-0">
        <!-- The slash is drawn, not looked up: PrimeIcons has no slashed microphone, and binding a
             `pi-microphone-slash` that does not exist renders an empty glyph - which is exactly what
             this button did when muted, a red square with no icon in it. See .icon-slashed. -->
        <span [class.icon-slashed]="isMuted()"
              class="relative flex items-center justify-center transition-transform duration-150 group-hover:scale-110">
            <i class="pi pi-microphone text-base"></i>
        </span>
    </button>

    <!-- Deafen -->
    <button
            (click)="deafenToggle.emit()"
            [ngClass]="isDeafened()
      ? 'bg-rose-500/20 text-rose-400 hover:bg-rose-500/30'
      : 'bg-white/[0.07] text-white/60 hover:bg-white/[0.12] hover:text-white/80'"
            [title]="isDeafened() ? 'Undeafen' : 'Deafen'"
            class="group w-12 h-12 rounded-xl flex items-center justify-center transition-all duration-150 active:scale-95 cursor-pointer border-0">
        <!-- Headphones rather than a speaker, and slashed only when deafened: the icon used to be
             the "off" speaker in both states, so the button never showed which way it was set. -->
        <span [class.icon-slashed]="isDeafened()"
              class="relative flex items-center justify-center transition-transform duration-150 group-hover:scale-110">
            <i class="pi pi-headphones text-base"></i>
        </span>
    </button>

    <!-- Camera -->
    <button
            (click)="cameraToggle.emit()"
            [ngClass]="isCameraOn()
      ? 'bg-brand/20 text-brand-dim hover:bg-brand/30'
      : 'bg-white/[0.07] text-white/60 hover:bg-white/[0.12] hover:text-white/80'"
            [title]="isCameraOn() ? 'Turn off camera' : 'Turn on camera'"
            class="group w-12 h-12 rounded-xl flex items-center justify-center transition-all duration-150 active:scale-95 cursor-pointer border-0">
        <i class="pi pi-camera text-base transition-transform duration-150 group-hover:scale-110"></i>
    </button>

    <!-- Screen share -->
    <button
            (click)="screenShareToggle.emit()"
            [ngClass]="isScreenSharing()
      ? 'bg-brand/20 text-brand-dim hover:bg-brand/30'
      : 'bg-white/[0.07] text-white/60 hover:bg-white/[0.12] hover:text-white/80'"
            [title]="isScreenSharing() ? 'Stop sharing' : 'Share screen'"
            class="group w-12 h-12 rounded-xl flex items-center justify-center transition-all duration-150 active:scale-95 cursor-pointer border-0">
        <i class="pi pi-desktop text-base transition-transform duration-150 group-hover:scale-110"></i>
    </button>

    <!-- Mute stream audio -only shown when sharing and screen has audio -->
    @if (isScreenSharing() && screenHasAudio()) {
        <button
                (click)="screenAudioToggle.emit()"
                [ngClass]="screenAudioMuted()
        ? 'bg-rose-500/20 text-rose-400 hover:bg-rose-500/30'
        : 'bg-white/[0.07] text-white/60 hover:bg-white/[0.12] hover:text-white/80'"
                [title]="screenAudioMuted() ? 'Unmute stream audio' : 'Mute stream audio'"
                class="group w-12 h-12 rounded-xl flex items-center justify-center transition-all duration-150 active:scale-95 cursor-pointer border-0">
            <i [ngClass]="screenAudioMuted() ? 'pi-volume-off' : 'pi-volume-up'"
               class="pi text-base transition-transform duration-150 group-hover:scale-110"></i>
        </button>
    }

    <!-- Stream quality -visible only while sharing. Bitrate is derived from the pair, never set. -->
    @if (isScreenSharing() && preset()) {
        <div class="flex items-center gap-0.5 bg-white/[0.05] rounded-lg px-1 py-1 border border-white/[0.08]">
            @for (res of resolutions; track res.value) {
                <button
                        (click)="setResolution(res.value)"
                        [ngClass]="isResolution(res.value)
            ? 'bg-brand text-white'
            : 'bg-transparent text-white/45 hover:text-white/75 hover:bg-white/[0.07]'"
                        [title]="res.label"
                        class="px-2 py-1 rounded text-xs font-mono transition-all border-0 cursor-pointer leading-none active:scale-90">{{ res.label }}
                </button>
            }
        </div>
        <div class="flex items-center gap-0.5 bg-white/[0.05] rounded-lg px-1 py-1 border border-white/[0.08]">
            @for (fps of framerates; track fps) {
                <button
                        (click)="setFramerate(fps)"
                        [ngClass]="isFramerate(fps)
            ? 'bg-brand text-white'
            : 'bg-transparent text-white/45 hover:text-white/75 hover:bg-white/[0.07]'"
                        [title]="fps + ' fps'"
                        class="px-2 py-1 rounded text-xs font-mono transition-all border-0 cursor-pointer leading-none active:scale-90">{{ fps }}
                </button>
            }
        </div>
    }

    <div class="w-px h-7 bg-white/[0.12] mx-1"></div>

    <!-- Disconnect / End Call -->
    <button
            (click)="disconnect.emit()"
            [title]="disconnectLabel()"
            class="group w-12 h-12 rounded-xl flex items-center justify-center bg-rose-500/15 hover:bg-rose-500/25 text-rose-400 hover:text-rose-300 transition-all duration-150 active:scale-95 cursor-pointer border-0">
        <i class="pi pi-phone text-base transition-transform duration-150 group-hover:scale-110" style="transform: rotate(135deg); display: inline-block;"></i>
    </button>

</div>
