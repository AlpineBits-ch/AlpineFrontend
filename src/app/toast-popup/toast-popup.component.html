<div class="card" [class.leaving]="leaving" (click)="handleClick()">

  <div class="avatar">
    @if (avatarUrl) {
      <img class="avatar__img" [src]="avatarUrl" [alt]="title" />
    } @else {
      <div class="avatar__fallback">{{ avatarLetter }}</div>
    }
  </div>

  <div class="content">
    <div class="title">{{ title }}</div>
    @if (body) {
      <div class="body-text">{{ body }}</div>
    }
  </div>

  <button class="close-btn" (click)="handleDismiss($event)" aria-label="Dismiss">
    <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
      <path d="M1.5 1.5L8.5 8.5M8.5 1.5L1.5 8.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    </svg>
  </button>

  @if (duration > 0) {
    <div class="progress" [style.animation-duration.ms]="duration"></div>
  }

</div>
