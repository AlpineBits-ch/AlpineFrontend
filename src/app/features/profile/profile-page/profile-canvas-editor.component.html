@if (canvas(); as arranged) {
    <div class="mx-auto w-full max-w-3xl px-6 py-6">
        @if (editing()) {
            <div class="mb-3 flex justify-end">
                <button
                    (click)="openWidgetMenu($event)"
                    class="flex cursor-pointer items-center gap-2 rounded-lg border-0 bg-card px-3 py-1.5 text-sm text-text-primary transition-colors hover:bg-hover focus-visible:outline focus-visible:outline-2 focus-visible:outline-brand"
                    data-testid="add-widget"
                    type="button"
                >
                    <i class="pi pi-plus text-xs" aria-hidden="true"></i>
                    {{ 'PROFILE.CANVAS.EDITOR.ADD' | translate }}
                </button>
                <app-context-menu #widgetMenu [model]="addWidgetItems()" />
            </div>
        }

        <div #canvasHost class="relative">
            <app-canvas-lattice
                [active]="editing()"
                [columns]="canvasColumns"
                [rows]="canvasRowCount()"
                class="pointer-events-none absolute inset-x-0 top-0 block"
            />
            <app-profile-canvas
                (widgetSelected)="onWidgetSelected($event)"
                [canvas]="arranged"
                [columns]="canvasColumns"
                [owner]="owner()"
                [selectable]="editing()"
                [selectedId]="selectedWidgetId()"
                class="relative z-10 block"
            />
        </div>
    </div>
}

@if (popoverWidget(); as widget) {
    <app-widget-editor-popover
        (deleted)="onEditorDeleted()"
        (dismissed)="onEditorDismissed()"
        (escaped)="onEditorEscaped()"
        [anchor]="selectedTileEl()!"
        [widget]="widget"
    />
}
