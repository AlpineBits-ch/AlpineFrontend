<div class="flex flex-col gap-8 max-w-2xl">

  <!-- General -->
  <section class="flex flex-col gap-4">
    <h2 class="text-xs font-semibold text-white/30 uppercase tracking-widest border-b border-white/[0.06] pb-3">General</h2>

    <div class="flex items-center justify-between bg-white/[0.03] border border-white/[0.06] rounded-xl px-4 py-3">
      <div>
        <p class="text-sm text-white/75">Enable Notifications</p>
        <p class="text-xs text-white/35 mt-0.5">Receive alerts for messages and activity.</p>
      </div>
      <p-toggleswitch
        [ngModel]="userSettings.notificationSettings().enabled"
        (ngModelChange)="userSettings.updateNotifications({ enabled: $event })" />
    </div>
  </section>

  <!-- Messages -->
  <section class="flex flex-col gap-4 transition-opacity duration-200"
           [class.opacity-40]="!userSettings.notificationSettings().enabled"
           [class.pointer-events-none]="!userSettings.notificationSettings().enabled">
    <h2 class="text-xs font-semibold text-white/30 uppercase tracking-widest border-b border-white/[0.06] pb-3">Messages</h2>

    <div class="flex items-center justify-between bg-white/[0.03] border border-white/[0.06] rounded-xl px-4 py-3">
      <div>
        <p class="text-sm text-white/75">Direct Messages</p>
        <p class="text-xs text-white/35 mt-0.5">Notify me when I receive a direct message.</p>
      </div>
      <p-toggleswitch
        [ngModel]="userSettings.notificationSettings().dm"
        (ngModelChange)="userSettings.updateNotifications({ dm: $event })" />
    </div>

    <div class="flex items-center justify-between bg-white/[0.03] border border-white/[0.06] rounded-xl px-4 py-3">
      <div>
        <p class="text-sm text-white/75">Mentions & Replies</p>
        <p class="text-xs text-white/35 mt-0.5">Notify me when someone mentions or replies to me.</p>
      </div>
      <p-toggleswitch
        [ngModel]="userSettings.notificationSettings().mentions"
        (ngModelChange)="userSettings.updateNotifications({ mentions: $event })" />
    </div>
  </section>

  <!-- Sounds -->
  <section class="flex flex-col gap-4 transition-opacity duration-200"
           [class.opacity-40]="!userSettings.notificationSettings().enabled"
           [class.pointer-events-none]="!userSettings.notificationSettings().enabled">
    <h2 class="text-xs font-semibold text-white/30 uppercase tracking-widest border-b border-white/[0.06] pb-3">Sounds</h2>

    <div class="flex items-center justify-between bg-white/[0.03] border border-white/[0.06] rounded-xl px-4 py-3">
      <div>
        <p class="text-sm text-white/75">Notification Sounds</p>
        <p class="text-xs text-white/35 mt-0.5">Play a sound when a notification arrives.</p>
      </div>
      <p-toggleswitch
        [ngModel]="userSettings.notificationSettings().sounds"
        (ngModelChange)="userSettings.updateNotifications({ sounds: $event })" />
    </div>
  </section>

</div>
