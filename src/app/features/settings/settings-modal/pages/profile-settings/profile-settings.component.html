<div class="flex flex-col gap-8 max-w-2xl">

  <!-- Avatar section -->
  <section class="flex flex-col gap-4">
    <h2 class="text-xs font-semibold text-white/30 uppercase tracking-widest border-b border-white/[0.06] pb-3">Avatar</h2>
    <div class="flex items-center gap-5">
      <div class="w-20 h-20 rounded-full bg-indigo-500/20 border-2 border-white/10 flex items-center justify-center text-3xl text-white/30">
        <i class="pi pi-user"></i>
      </div>
      <div class="flex flex-col gap-2">
        <button class="px-4 py-2 bg-indigo-600/80 hover:bg-indigo-600 rounded-xl text-sm font-medium text-white transition-all cursor-pointer border-0">
          Change Avatar
        </button>
        <button class="px-4 py-2 bg-white/[0.05] hover:bg-white/[0.09] text-white/45 hover:text-white/70 rounded-xl text-sm font-medium transition-all cursor-pointer border-0">
          Remove
        </button>
      </div>
    </div>
  </section>

  <!-- Display info -->
  <section class="flex flex-col gap-4">
    <h2 class="text-xs font-semibold text-white/30 uppercase tracking-widest border-b border-white/[0.06] pb-3">Display</h2>

    <div class="flex flex-col gap-1.5">
      <label class="text-xs font-medium text-white/45 uppercase tracking-wide">Display Name</label>
      <input type="text" placeholder="Your display name" disabled
        class="w-full bg-white/[0.04] border border-white/[0.09] rounded-xl px-4 py-2.5 text-sm text-white/40 placeholder:text-white/20 outline-none cursor-not-allowed" />
      <p class="text-[11px] text-white/25">Coming soon — this will be your visible name in chats.</p>
    </div>

    <div class="flex flex-col gap-1.5">
      <label class="text-xs font-medium text-white/45 uppercase tracking-wide">Bio</label>
      <textarea rows="3" placeholder="Tell people a bit about yourself…" disabled
        class="w-full bg-white/[0.04] border border-white/[0.09] rounded-xl px-4 py-2.5 text-sm text-white/40 placeholder:text-white/20 outline-none cursor-not-allowed resize-none"></textarea>
    </div>
  </section>

  <!-- Account info (read-only) -->
  <section class="flex flex-col gap-4">
    <h2 class="text-xs font-semibold text-white/30 uppercase tracking-widest border-b border-white/[0.06] pb-3">Account</h2>

    <div class="flex flex-col gap-3">
      <div class="flex items-center justify-between bg-white/[0.03] border border-white/[0.06] rounded-xl px-4 py-3">
        <div>
          <p class="text-xs text-white/30 mb-0.5">Username</p>
          <p class="text-sm text-white/60">—</p>
        </div>
        <button class="text-xs text-indigo-400/70 hover:text-indigo-400 transition-colors cursor-pointer border-0 bg-transparent">Edit</button>
      </div>
      <div class="flex items-center justify-between bg-white/[0.03] border border-white/[0.06] rounded-xl px-4 py-3">
        <div>
          <p class="text-xs text-white/30 mb-0.5">Email</p>
          <p class="text-sm text-white/60">—</p>
        </div>
        <button class="text-xs text-indigo-400/70 hover:text-indigo-400 transition-colors cursor-pointer border-0 bg-transparent">Edit</button>
      </div>
      <div class="flex items-center justify-between bg-white/[0.03] border border-white/[0.06] rounded-xl px-4 py-3">
        <div>
          <p class="text-xs text-white/30 mb-0.5">Password</p>
          <p class="text-sm text-white/60">••••••••</p>
        </div>
        <button class="text-xs text-indigo-400/70 hover:text-indigo-400 transition-colors cursor-pointer border-0 bg-transparent">Change</button>
      </div>
    </div>
  </section>

  <!-- Save -->
  <div class="flex items-center gap-3 pt-2">
    <button disabled class="px-5 py-2.5 bg-indigo-600/50 rounded-xl text-sm font-semibold text-white/40 cursor-not-allowed border-0">
      Save Changes
    </button>
    <button disabled class="px-5 py-2.5 bg-white/[0.04] rounded-xl text-sm font-medium text-white/30 cursor-not-allowed border-0">
      Reset
    </button>
  </div>

</div>
