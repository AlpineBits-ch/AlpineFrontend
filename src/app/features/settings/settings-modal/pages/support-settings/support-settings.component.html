<div class="flex flex-col gap-8 max-w-2xl">
    <!-- Getting help -->
    <section class="flex flex-col gap-4">
        <h2 class="text-xs font-semibold text-white/30 uppercase tracking-widest border-b border-white/[0.10] pb-3">
            {{ 'SETTINGS.SUPPORT.SECTION_HELP' | translate }}
        </h2>
        <p class="text-xs text-white/35 -mt-1">{{ 'SETTINGS.SUPPORT.SECTION_HELP_DESC' | translate }}</p>

        <div class="flex items-center justify-between gap-3 bg-white/[0.03] border border-white/[0.10] rounded-xl px-4 py-3">
            <div class="min-w-0">
                <p class="text-sm text-white/60">{{ 'SETTINGS.SUPPORT.SITE_LABEL' | translate }}</p>
                <p class="text-xs text-white/25 mt-0.5 truncate font-mono">{{ support.url() }}</p>
            </div>
            <p-button
                (onClick)="open()"
                [label]="'SETTINGS.GET_SUPPORT' | translate"
                icon="pi pi-external-link"
                severity="secondary"
                size="small"
                styleClass="shrink-0"
            />
        </div>
    </section>

    <app-reports-filed />
</div>
