<!-- ── Incoming call ────────────────────────────────────────────────────── -->
@if (callState.incomingCall(); as inc) {

    <!-- Backdrop -->
    <div class="fixed inset-0 bg-black/50 backdrop-blur-[3px]" style="z-index:1990"></div>

    <!-- Card -->
    <div class="fixed inset-0 flex items-center justify-center pointer-events-none" style="z-index:2000">
        <div class="pointer-events-auto call-card-enter w-80 rounded-2xl overflow-hidden
                border border-white/[0.10] shadow-2xl" style="background: var(--color-sidebar)">

            <!-- Emerald header band -->
            <div class="px-5 py-3 flex items-center gap-2.5 border-b border-emerald-500/20"
                 style="background:linear-gradient(90deg,rgba(52,211,153,0.18),rgba(52,211,153,0.05))">
        <span class="relative flex h-2 w-2 shrink-0">
          <span class="animate-ping absolute inset-0 rounded-full bg-emerald-400 opacity-75"></span>
          <span class="relative rounded-full h-2 w-2 bg-emerald-400"></span>
        </span>
                <span class="text-[0.6875rem] font-semibold text-emerald-400 uppercase tracking-widest">
          Incoming Voice Call
        </span>
            </div>

            <!-- Body -->
            <div class="px-8 py-7 flex flex-col items-center gap-6">

                <!-- Avatar with concentric pulse rings -->
                <div class="relative flex items-center justify-center w-24 h-24">
                    <div class="absolute w-32 h-32 rounded-full border border-emerald-400/15 animate-ping"></div>
                    <div class="absolute w-28 h-28 rounded-full border border-emerald-400/25 animate-pulse"></div>
                    <p-avatar [label]="inc.avatarLabel" shape="circle"
                              styleClass="!w-20 !h-20 !text-3xl relative z-10"/>
                </div>

                <!-- Name -->
                <h2 class="text-lg font-bold text-white/90 text-center leading-tight -mt-1">
                    {{ inc.displayName }}
                </h2>

                <!-- Decline / Accept -->
                <div class="flex items-end gap-12">
                    <div class="flex flex-col items-center gap-2">
                        <button (click)="callState.reject()"
                                class="w-14 h-14 rounded-full flex items-center justify-center cursor-pointer
                     border border-rose-500/35 bg-rose-500/15 hover:bg-rose-500/30
                     transition-all duration-200 group active:scale-95">
                            <i class="pi pi-phone text-rose-400 text-xl rotate-[135deg]
                        group-hover:scale-110 transition-transform duration-150"></i>
                        </button>
                        <span class="text-[0.6875rem] text-white/35">Decline</span>
                    </div>

                    <div class="flex flex-col items-center gap-2">
                        <button (click)="callState.accept()"
                                class="w-14 h-14 rounded-full flex items-center justify-center cursor-pointer
                     border border-emerald-500/35 bg-emerald-500/15 hover:bg-emerald-500/30
                     transition-all duration-200 group active:scale-95">
                            <i class="pi pi-phone text-emerald-400 text-xl
                        group-hover:scale-110 transition-transform duration-150"></i>
                        </button>
                        <span class="text-[0.6875rem] text-white/35">Accept</span>
                    </div>
                </div>

            </div>
        </div>
    </div>
}

<!-- ── Outgoing call ────────────────────────────────────────────────────── -->
@if (showOutgoingCard() && callState.outgoingCall(); as out) {
    <div class="fixed bottom-6 right-6 w-72 rounded-2xl overflow-hidden call-card-enter
              border border-white/[0.08] shadow-2xl" style="z-index:1800; background: var(--color-sidebar)">

        <!-- Indigo accent line -->
        <div class="h-[2px] bg-gradient-to-r from-[color-mix(in_srgb,var(--color-brand)_70%,transparent)] via-[color-mix(in_srgb,var(--color-brand-dim)_30%,transparent)] to-transparent"></div>

        <div class="px-4 py-4 flex items-center gap-3">

            <!-- Avatar with soft pulse halo -->
            <div class="relative shrink-0">
                <div class="absolute inset-0 rounded-full bg-[color-mix(in_srgb,var(--color-brand)_20%,transparent)] scale-[1.35] animate-pulse"></div>
                <p-avatar [label]="out.avatarLabel" shape="circle" size="large" styleClass="relative z-10"/>
            </div>

            <!-- Info -->
            <div class="flex-1 min-w-0">
                <div class="flex items-center gap-0.5 text-[0.6875rem] text-white/40 mb-0.5">
                    <span>Calling</span>
                    <span class="dot" style="animation-delay:0ms">.</span>
                    <span class="dot" style="animation-delay:250ms">.</span>
                    <span class="dot" style="animation-delay:500ms">.</span>
                </div>
                <p class="text-sm font-semibold text-white/85 truncate">{{ out.displayName }}</p>
            </div>

            <!-- Cancel -->
            <button (click)="callState.cancelOutgoing()"
                    class="shrink-0 w-10 h-10 rounded-full flex items-center justify-center cursor-pointer
               border border-rose-500/35 bg-rose-500/15 hover:bg-rose-500/30
               transition-all duration-200 group active:scale-95">
                <i class="pi pi-phone text-rose-400 rotate-[135deg]
                  group-hover:scale-110 transition-transform duration-150"></i>
            </button>
        </div>
    </div>
}
