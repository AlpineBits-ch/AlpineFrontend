<p-dialog
        (onHide)="mfaChallenge.dismiss()"
        (onShow)="onShow()"
        [(visible)]="mfaChallenge.visible"
        [breakpoints]="{ '640px': '95vw' }"
        [closable]="true"
        [dismissableMask]="false"
        [draggable]="false"
        [modal]="true"
        [resizable]="false"
        [style]="{ width: '440px' }"
        appendTo="body">

    <ng-template pTemplate="header">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-lg flex items-center justify-center"
                 style="background: color-mix(in srgb, var(--color-brand) 12%, transparent)">
                <i class="pi pi-shield text-sm" style="color: var(--color-brand-dim)"></i>
            </div>
            <span class="text-base font-semibold" style="color: var(--color-text-primary)">
                {{ 'LOGIN.MFA.TITLE' | translate }}
            </span>
        </div>
    </ng-template>

    <div class="flex flex-col gap-5 pt-1">
        <p class="text-sm m-0" style="color: var(--color-text-secondary)">
            {{ (useRecoveryCode() ? 'LOGIN.MFA.RECOVERY_DESCRIPTION' : 'LOGIN.MFA.DESCRIPTION') | translate }}
        </p>

        @if (!useRecoveryCode()) {
            <div class="flex flex-col items-center gap-3">
                <p-inputotp
                        (ngModelChange)="onCodeChange($event)"
                        [integerOnly]="true"
                        [length]="6"
                        [ngModel]="code()"
                        styleClass="gap-2"/>
            </div>
        } @else {
            <div class="flex flex-col gap-1.5">
                <label class="text-xs font-medium uppercase tracking-wide" style="color: var(--color-text-muted)">
                    {{ 'LOGIN.MFA.RECOVERY_CODE_LABEL' | translate }}
                </label>
                <input
                        (ngModelChange)="onCodeChange($event)"
                        [ngModel]="code()"
                        [placeholder]="'LOGIN.MFA.RECOVERY_CODE_PLACEHOLDER' | translate"
                        autocomplete="one-time-code"
                        class="w-full"
                        pInputText
                        type="text"/>
            </div>
        }

        @if (invalidCode()) {
            <p class="text-xs m-0" style="color: var(--color-offline)">
                {{ 'LOGIN.MFA.INVALID_CODE' | translate }}
            </p>
        }

        <p-button
                (onClick)="toggleRecoveryCode()"
                [label]="(useRecoveryCode() ? 'LOGIN.MFA.USE_AUTHENTICATOR_CODE' : 'LOGIN.MFA.USE_RECOVERY_CODE') | translate"
                [text]="true"
                severity="secondary"
                size="small"
                styleClass="self-start !px-0"/>
    </div>

    <ng-template pTemplate="footer">
        <div class="flex items-center justify-end gap-2 w-full">
            <p-button
                    (onClick)="submit()"
                    [disabled]="code().length < minCodeLength() || loading()"
                    [label]="'LOGIN.MFA.VERIFY' | translate"
                    [loading]="loading()"
                    severity="primary"
                    size="small"/>
        </div>
    </ng-template>

</p-dialog>
