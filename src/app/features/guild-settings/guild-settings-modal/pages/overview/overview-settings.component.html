<div class="h-full overflow-y-auto px-6 sm:px-8 py-6"
     style="scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.08) transparent;">
  <div class="flex flex-col gap-8 max-w-2xl">

    <!-- Icon section -->
    <section class="flex flex-col gap-4">
      <h2 class="text-xs font-semibold text-white/30 uppercase tracking-widest border-b border-white/[0.06] pb-3">
        Server Icon
      </h2>
      <div class="flex items-center gap-5">

        <!-- Icon preview -->
        <div class="relative w-20 h-20 shrink-0 cursor-pointer group rounded-2xl overflow-hidden"
             (click)="pickIcon()">
          @if (iconPreview()) {
            <img [src]="iconPreview()!" alt="Server icon"
              class="w-full h-full object-cover transition-opacity group-hover:opacity-70" />
          } @else {
            <div class="w-full h-full bg-indigo-500/20 flex items-center justify-center text-3xl font-bold text-indigo-300 transition-opacity group-hover:opacity-70">
              {{ iconLabel }}
            </div>
          }
          <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
            <i class="pi pi-camera text-white text-lg drop-shadow"></i>
          </div>
        </div>

        <!-- Actions -->
        <div class="flex flex-col gap-2">
          <input #iconInput type="file" accept="image/*" class="hidden" (change)="onIconSelected($event)" />
          <p-button label="Upload Icon" severity="primary" size="small" (onClick)="pickIcon()" />
          @if (iconPreview()) {
            <p-button label="Remove" severity="secondary" size="small" (onClick)="removeIcon()" />
          }
          <p class="text-[11px] text-white/25">Recommended: 512×512 px or larger</p>
        </div>

      </div>
    </section>

    <!-- Name & description -->
    <section class="flex flex-col gap-4">
      <h2 class="text-xs font-semibold text-white/30 uppercase tracking-widest border-b border-white/[0.06] pb-3">
        Details
      </h2>

      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-medium text-white/45 uppercase tracking-wide">Server Name</label>
        <input type="text"
          [value]="name()"
          (input)="name.set($any($event.target).value)"
          placeholder="Enter server name"
          class="w-full bg-white/[0.04] border border-white/[0.09] rounded-xl px-4 py-2.5 text-sm text-white/85 placeholder:text-white/20 outline-none focus:border-indigo-500/60 transition-colors" />
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-medium text-white/45 uppercase tracking-wide">Description</label>
        <textarea
          rows="3"
          [value]="description()"
          (input)="description.set($any($event.target).value)"
          placeholder="Describe your server…"
          class="w-full bg-white/[0.04] border border-white/[0.09] rounded-xl px-4 py-2.5 text-sm text-white/85 placeholder:text-white/20 outline-none focus:border-indigo-500/60 transition-colors resize-none"
          style="scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.08) transparent;"></textarea>
      </div>
    </section>

    <!-- Save -->
    <div class="flex items-center gap-3">
      <p-button label="Save Changes" severity="primary" [loading]="saving()" (onClick)="save()" />
    </div>

  </div>
</div>
