<div class="max-w-lg space-y-6">

  <!-- Icon -->
  <div>
    <p class="text-xs font-semibold text-white/40 uppercase tracking-widest mb-3">{{ 'GUILD_SETTINGS.OVERVIEW.SERVER_ICON' | translate }}</p>
    <div class="flex items-center gap-5">
      <div class="relative group">
        <div class="w-20 h-20 rounded-2xl overflow-hidden bg-card flex items-center justify-center border border-white/[0.08]">
          @if (iconPreview()) {
            <img [src]="iconPreview()!" alt="guild icon" class="w-full h-full object-cover"
                 (error)="onIconLoadError()" />
          } @else {
            <span class="text-2xl font-bold text-white/30">{{ guild().name.charAt(0).toUpperCase() }}</span>
          }
        </div>
        <label class="absolute inset-0 rounded-2xl bg-black/50 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity cursor-pointer">
          <i class="pi pi-camera text-white text-lg"></i>
          <input type="file" accept="image/*" class="hidden" (change)="onIconSelected($event)" />
        </label>
      </div>
      <div class="space-y-1.5">
        <label class="block cursor-pointer">
          <span class="inline-flex items-center gap-2 px-3 py-1.5 rounded-lg bg-white/[0.06] hover:bg-white/[0.1] text-sm text-white/70 hover:text-white/90 transition-all cursor-pointer">
            <i class="pi pi-upload text-xs"></i> {{ 'GUILD_SETTINGS.OVERVIEW.UPLOAD_IMAGE' | translate }}
          </span>
          <input type="file" accept="image/*" class="hidden" (change)="onIconSelected($event)" />
        </label>
        @if (iconPreview()) {
          <button (click)="removeIcon()"
            class="flex items-center gap-2 px-3 py-1.5 rounded-lg text-sm text-rose-400 hover:text-rose-300 hover:bg-rose-500/10 transition-all cursor-pointer border-0 bg-transparent">
            <i class="pi pi-trash text-xs"></i> {{ 'GUILD_SETTINGS.OVERVIEW.REMOVE_ICON' | translate }}
          </button>
        }
        <p class="text-[11px] text-white/25">{{ 'GUILD_SETTINGS.OVERVIEW.ICON_HINT' | translate }}</p>
      </div>
    </div>
  </div>

  <div class="border-t border-white/[0.10]"></div>

  <!-- Name -->
  <div>
    <label class="block text-xs font-semibold text-white/40 uppercase tracking-widest mb-2">
      {{ 'GUILD_SETTINGS.OVERVIEW.SERVER_NAME' | translate }} <span class="text-rose-400">*</span>
    </label>
    <input pInputText
      [ngModel]="name()"
      (ngModelChange)="name.set($event); onFieldChange()"
      [placeholder]="'GUILD_SETTINGS.OVERVIEW.SERVER_NAME_PLACEHOLDER' | translate"
      class="w-full" />
  </div>

  <!-- Description -->
  <div>
    <label class="block text-xs font-semibold text-white/40 uppercase tracking-widest mb-2">{{ 'GUILD_SETTINGS.OVERVIEW.DESCRIPTION' | translate }}</label>
    <textarea pTextarea
      [ngModel]="description()"
      (ngModelChange)="description.set($event); onFieldChange()"
      [placeholder]="'GUILD_SETTINGS.OVERVIEW.DESCRIPTION_PLACEHOLDER' | translate"
      rows="3"
      class="w-full resize-none"></textarea>
  </div>

  <!-- Save -->
  @if (dirty()) {
    <div class="flex items-center gap-3 pt-1">
      <p-button [label]="'GUILD_SETTINGS.OVERVIEW.SAVE_CHANGES' | translate" severity="primary" size="small"
        [loading]="saving()" (onClick)="save()" />
      <p-button [label]="'GUILD_SETTINGS.OVERVIEW.RESET' | translate" severity="secondary" size="small" [text]="true"
        (onClick)="ngOnInit()" />
    </div>
  }

</div>

<!-- Crop dialog -->
<p-dialog
  [(visible)]="cropVisible"
  [header]="'GUILD_SETTINGS.OVERVIEW.CROP_ICON' | translate"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  appendTo="body"
  [style]="{width: '380px'}">
  @if (cropVisible() && cropSrc()) {
    <app-image-cropper
      [imageSrc]="cropSrc()"
      [circular]="false"
      [outputSize]="400"
      (confirmed)="onCropConfirmed($event)"
      (cancelled)="cropVisible.set(false)" />
  }
</p-dialog>
