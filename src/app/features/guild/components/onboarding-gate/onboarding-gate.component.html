@if (pending()) {
    <p-dialog [closable]="false" [dismissableMask]="false" [draggable]="false" [modal]="true"
              [style]="{width: '480px'}" [visible]="true" appendTo="body">
        <ng-template pTemplate="header">
            <span class="text-sm font-semibold text-text-primary">{{ guildName() }}</span>
        </ng-template>

        <div class="flex flex-col gap-4">
            <p class="text-xs font-semibold text-text-muted uppercase tracking-widest">
                {{ 'ONBOARDING_GATE.RULES_HEADING' | translate }}
            </p>

            <div class="max-h-[50vh] overflow-y-auto thin-scrollbar bg-card/60 border border-border rounded-xl p-4">
                <p class="whitespace-pre-wrap text-[0.8125rem] text-text-secondary">{{ status()?.rulesText }}</p>
            </div>

            @if (defaultChannels().length > 0) {
                <div class="flex flex-col gap-1.5">
                    <p class="text-xs text-text-muted">{{ 'ONBOARDING_GATE.CHANNELS_HINT' | translate }}</p>
                    <div class="flex flex-wrap gap-2">
                        @for (channel of defaultChannels(); track channel.id) {
                            <button (click)="openChannel(channel)"
                                    class="flex items-center gap-1.5 bg-hover border border-border rounded-full px-3 py-1 text-[0.8125rem] text-text-primary cursor-pointer">
                                <i class="pi pi-hashtag text-[0.625rem]"></i>
                                <span>{{ channel.name }}</span>
                            </button>
                        }
                    </div>
                </div>
            }
        </div>

        <ng-template pTemplate="footer">
            <p-button (onClick)="accept()" [label]="'ONBOARDING_GATE.ACCEPT' | translate" severity="primary"/>
        </ng-template>
    </p-dialog>
}
