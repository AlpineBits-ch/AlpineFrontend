<div class="space-y-4">
    <p class="text-xs text-text-muted max-w-prose">{{ 'PERM_OVERRIDE.INTRO_CATEGORY' | translate }}</p>

    <div class="flex gap-1 p-1 bg-card rounded-xl w-fit" role="tablist">
        <button
            (click)="switchTab('roles')"
            [attr.aria-selected]="activeTab() === 'roles'"
            [ngClass]="activeTab() === 'roles' ? 'bg-hover text-text-primary' : 'text-text-muted hover:text-text-secondary'"
            class="px-4 py-1.5 rounded-lg text-sm font-medium transition-all cursor-pointer border-0"
            role="tab"
        >
            {{ 'PERM_OVERRIDE.ROLES' | translate }}
        </button>
        <button
            (click)="switchTab('members')"
            [attr.aria-selected]="activeTab() === 'members'"
            [ngClass]="activeTab() === 'members' ? 'bg-hover text-text-primary' : 'text-text-muted hover:text-text-secondary'"
            class="px-4 py-1.5 rounded-lg text-sm font-medium transition-all cursor-pointer border-0"
            role="tab"
        >
            {{ 'PERM_OVERRIDE.MEMBERS' | translate }}
        </button>
    </div>

    @if (activeTab() === 'roles') {
        <app-permission-overrides-panel
            (add)="onAddRole($event)"
            (change)="onRoleChange($event.id, $event.override)"
            (delete)="deleteRole($event)"
            (save)="saveRole($event)"
            [addable]="addableRoles()"
            [entries]="roleEntries()"
            kind="role"
        />
    }

    @if (activeTab() === 'members') {
        <app-permission-overrides-panel
            (add)="onAddMember($event)"
            (change)="onMemberChange($event.id, $event.override)"
            (delete)="deleteMember($event)"
            (save)="saveMember($event)"
            [addable]="addableMembers()"
            [entries]="memberEntries()"
            [loading]="membersLoading()"
            kind="member"
        />
    }
</div>
