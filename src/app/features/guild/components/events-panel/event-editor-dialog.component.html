<p-dialog (onHide)="close()" [(visible)]="visible" [draggable]="false" [modal]="true" [resizable]="false"
          [style]="{width: '440px'}" appendTo="body">
    <ng-template pTemplate="header">
        <span class="text-sm font-semibold text-text-primary">
            {{ (event() ? 'EVENTS.EDIT_TITLE' : 'EVENTS.CREATE_TITLE') | translate }}
        </span>
    </ng-template>

    <div class="space-y-4">

        <!-- Title -->
        <div>
            <label class="block text-xs font-semibold text-text-muted uppercase tracking-widest mb-2">
                {{ 'EVENTS.FIELD_TITLE' | translate }} <span class="text-rose-400">*</span>
            </label>
            <input (ngModelChange)="title.set($event)" [ngModel]="title()"
                   [placeholder]="'EVENTS.FIELD_TITLE_PLACEHOLDER' | translate"
                   class="w-full" pInputText type="text"/>
        </div>

        <!-- Description -->
        <div>
            <label class="block text-xs font-semibold text-text-muted uppercase tracking-widest mb-2">
                {{ 'EVENTS.FIELD_DESCRIPTION' | translate }}
            </label>
            <textarea (ngModelChange)="description.set($event)" [ngModel]="description()"
                      [placeholder]="'EVENTS.FIELD_DESCRIPTION_PLACEHOLDER' | translate"
                      class="w-full resize-none" pTextarea rows="3"></textarea>
        </div>

        <!-- Starts / Ends -->
        <div class="flex gap-3">
            <div class="flex-1">
                <label class="block text-xs font-semibold text-text-muted uppercase tracking-widest mb-2">
                    {{ 'EVENTS.FIELD_STARTS_AT' | translate }} <span class="text-rose-400">*</span>
                </label>
                <p-datepicker (ngModelChange)="startsAt.set($event)" [ngModel]="startsAt()" [showTime]="true"
                              hourFormat="24" styleClass="w-full"/>
            </div>
            <div class="flex-1">
                <label class="block text-xs font-semibold text-text-muted uppercase tracking-widest mb-2">
                    {{ 'EVENTS.FIELD_ENDS_AT' | translate }}
                </label>
                <p-datepicker (ngModelChange)="endsAt.set($event)" [ngModel]="endsAt()" [showClear]="true"
                              [showTime]="true" hourFormat="24" styleClass="w-full"/>
            </div>
        </div>
        @if (showDateError()) {
            <p class="text-[0.75rem] text-rose-400 -mt-2">{{ 'EVENTS.VALIDATION_END_BEFORE_START' | translate }}</p>
        }

        <!-- Location -->
        <div>
            <label class="block text-xs font-semibold text-text-muted uppercase tracking-widest mb-2">
                {{ 'EVENTS.FIELD_LOCATION' | translate }}
            </label>
            <input (ngModelChange)="location.set($event)" [ngModel]="location()"
                   [placeholder]="'EVENTS.FIELD_LOCATION_PLACEHOLDER' | translate"
                   class="w-full" pInputText type="text"/>
        </div>

        <!-- Voice channel -->
        <div>
            <label class="block text-xs font-semibold text-text-muted uppercase tracking-widest mb-2">
                {{ 'EVENTS.FIELD_VOICE_CHANNEL' | translate }}
            </label>
            <p-select (ngModelChange)="voiceChannelId.set($event)" [ngModel]="voiceChannelId()"
                      [options]="voiceChannelOptions()" [placeholder]="'EVENTS.FIELD_VOICE_CHANNEL_PLACEHOLDER' | translate"
                      [showClear]="true" [style]="{width: '100%'}" optionLabel="label" optionValue="value"/>
        </div>

    </div>

    <ng-template pTemplate="footer">
        <p-button (onClick)="close()" [text]="true" label="{{ 'EVENTS.CANCEL_BUTTON' | translate }}" severity="secondary"/>
        <p-button (onClick)="save()" [disabled]="!canSave()" [loading]="saving()"
                  label="{{ 'EVENTS.SAVE' | translate }}" severity="primary"/>
    </ng-template>
</p-dialog>
