<div
    class="flex flex-col w-[68px] h-full bg-app-bg border-r border-white/[0.10] items-center pb-3 gap-2 shrink-0"
    style="padding-top: calc(env(safe-area-inset-top) + 0.75rem)"
>
    <!-- Home / DMs button -->
    <button
        (click)="navService.selectDMs()"
        [ngClass]="isDMsActive() ? 'bg-brand/20' : 'bg-white/[0.07] hover:bg-brand/20'"
        class="w-11 h-11 flex items-center justify-center transition-colors cursor-pointer border-0 shrink-0 rounded-icon"
        aria-label="Home"
    >
        <img alt="Home" class="w-[120%] h-[120%]" src="assets/branding/home-icon-white.svg" />
    </button>

    <!-- Separator -->
    <div class="w-8 h-px bg-white/10 shrink-0"></div>

    <!-- Scrollable server icons -->
    <div class="flex-1 min-h-0 overflow-y-auto w-full flex flex-col items-center py-1" style="scrollbar-width: none">
        @for (server of serverIcons(); track server.id) {
            <div
                (mouseenter)="onServerHover(guilds()[$index])"
                (mouseleave)="hoveredServerId.set(null)"
                class="relative w-full flex justify-center items-center py-1"
            >
                <!-- Left pill indicator -->
                <span
                    [style.height]="getPillHeight(server)"
                    [style.opacity]="isPillVisible(server) ? '1' : '0'"
                    class="absolute left-0 top-1/2 -translate-y-1/2 w-1 rounded-r-full bg-white transition-[height,opacity] duration-base ease-brand pointer-events-none"
                >
                </span>
                <app-server-icon
                    (click)="navService.selectServer(guilds()[$index])"
                    (contextmenu)="onServerContextMenu($event, guilds()[$index])"
                    data-testid="guild-list-item"
                    [attr.data-guild-id]="server.id"
                    [attr.data-guild-name]="server.name"
                    [serverData]="server"
                >
                </app-server-icon>
            </div>
        }
    </div>

    <!-- Add server button -->
    <button
        (click)="showCreateModal.set(true)"
        data-testid="create-guild-button"
        class="w-11 h-11 rounded-icon border border-dashed border-white/20 text-text-muted hover:text-brand-dim hover:border-brand-dim hover:bg-brand/10 flex items-center justify-center transition-colors text-xl leading-none cursor-pointer bg-transparent shrink-0"
    >
        +
    </button>
</div>

<p-contextMenu #guildContextMenu appendTo="body" />

<app-create-guild-modal (guildCreated)="onGuildCreated($event)" [(visible)]="showCreateModal" />

@if (contextGuild()) {
    <app-guild-settings-modal
        (guildDeleted)="onGuildDeleted($event)"
        (guildUpdated)="onGuildSettingsUpdated($event)"
        [(isVisible)]="showGuildSettings"
        [guild]="contextGuild()!"
    />
}
