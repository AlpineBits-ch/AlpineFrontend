@if (entries().length) {
    <div class="relative">
        <!-- The thread the avatars hang off. Purely decorative, and behind the rows so a hover highlight covers it rather than being crossed by it. -->
        <div class="pointer-events-none absolute bottom-3 left-[1.5rem] top-3 w-px -translate-x-1/2
                    bg-white/[0.06]"></div>

        <div class="relative flex flex-col">
            @for (entry of entries(); track entry.id) {
                <button (click)="openPage.emit(entry.page)"
                        class="group/act flex w-full cursor-pointer items-center gap-3 rounded-xl
                               border-0 bg-transparent px-2 py-2 text-left transition-colors
                               hover:bg-white/[0.04]">

                    <span class="relative shrink-0">
                        <app-avatar [userId]="entry.actorId"/>
                        <span [class]="entry.kind === 'created'
                                         ? 'bg-brand text-white'
                                         : 'bg-card text-white/50'"
                              class="absolute -bottom-0.5 -right-0.5 flex h-4 w-4 items-center
                                     justify-center rounded-full border-2 border-app-bg">
                            <i [class]="entry.kind === 'created' ? 'pi pi-plus' : 'pi pi-pencil'"
                               class="text-[0.4375rem]"></i>
                        </span>
                    </span>

                    <span class="min-w-0 flex-1">
                        <span class="block truncate text-[0.8125rem] text-white/45">
                            @if (actorName(entry); as name) {
                                {{ (entry.kind === 'created' ? 'WIKI.ACTIVITY.CREATED_BY' : 'WIKI.ACTIVITY.EDITED_BY') | translate: {name: name} }}
                            } @else {
                                {{ (entry.kind === 'created' ? 'WIKI.ACTIVITY.CREATED' : 'WIKI.ACTIVITY.EDITED') | translate }}
                            }
                            <span class="font-medium text-white/85 group-hover/act:text-brand-dim">{{ entry.page.title }}</span>
                        </span>
                        <span class="mt-0.5 flex items-center gap-1.5 text-[0.6875rem] text-white/30">
                            <span>{{ entry.date | relativeTime: clock.now() }}</span>
                            @if (categoryName(entry.page); as category) {
                                <span aria-hidden="true">&middot;</span>
                                <span class="truncate">{{ category }}</span>
                            }
                        </span>
                    </span>

                    <i class="pi pi-angle-right shrink-0 text-[0.75rem] text-white/0
                              transition-colors group-hover/act:text-white/30"></i>
                </button>
            }
        </div>
    </div>
} @else {
    <p class="px-2 py-6 text-center text-[0.8125rem] text-white/30">
        {{ 'WIKI.ACTIVITY.EMPTY' | translate }}
    </p>
}
