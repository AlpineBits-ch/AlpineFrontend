<div class="flex flex-col h-full">

  <!-- Table context menu -->
  <p-contextMenu #ctxMenu [model]="contextMenuItems()" />

  <!-- Header -->
  <header class="flex items-center gap-3 px-6 py-3 border-b border-white/[0.08] shrink-0">
    <span class="text-sm font-semibold text-white/70">
      {{ page() ? 'Edit Page' : 'New Page' }}
    </span>
    <div class="flex items-center gap-1 ml-auto">
      <p-button label="Cancel" severity="secondary" size="small"
        (onClick)="cancelled.emit()" />
      <p-button label="Save" icon="pi pi-check" severity="primary" size="small"
        [loading]="saving()"
        [disabled]="!editorTitle().trim()"
        (onClick)="savePage()" />
    </div>
  </header>

  <div class="flex-1 min-h-0 flex flex-col overflow-hidden">

    <!-- Title -->
    <div class="px-8 pt-6 pb-4 border-b border-white/[0.05] shrink-0">
      <input
        class="w-full bg-transparent border-0 outline-none text-2xl font-bold text-white/90 placeholder-white/20"
        placeholder="Page title…"
        [ngModel]="editorTitle()"
        (ngModelChange)="editorTitle.set($event)" />
    </div>

    <!-- Meta row -->
    <div class="flex items-center gap-4 px-8 py-3 border-b border-white/[0.05] shrink-0 flex-wrap">

      <div class="flex items-center gap-2">
        <span class="text-xs text-white/35 shrink-0">Category</span>
        <p-select
          [options]="categoryOptions()"
          [ngModel]="editorCategoryId()"
          (ngModelChange)="editorCategoryId.set($event)"
          optionLabel="label" optionValue="value"
          placeholder="None"
          [style]="{minWidth: '130px'}"
          size="small" />
      </div>

      <div class="flex items-center gap-2">
        <span class="text-xs text-white/35 shrink-0">Parent</span>
        <p-select
          [options]="parentPageOptions()"
          [ngModel]="editorParentPageId()"
          (ngModelChange)="editorParentPageId.set($event)"
          optionLabel="label" optionValue="value"
          placeholder="None"
          [style]="{minWidth: '130px'}"
          size="small" />
      </div>

      <div class="flex items-center gap-2">
        <p-checkbox
          [ngModel]="editorIsPinned()"
          (ngModelChange)="editorIsPinned.set($event)"
          [binary]="true"
          inputId="pinned" />
        <label for="pinned" class="text-xs text-white/45 cursor-pointer select-none">Pinned</label>
      </div>

      <div class="flex items-center gap-2 flex-1 min-w-0">
        <span class="text-xs text-white/35 shrink-0">Tags</span>
        <div class="flex items-center gap-1.5 flex-wrap flex-1 min-w-0">
          @for (tag of editorTags(); track tag) {
            <span class="flex items-center gap-1 bg-brand/10 text-brand-dim text-[11px] px-2 py-0.5 rounded-full">
              {{ tag }}
              <button (click)="removeTag(tag)"
                class="text-brand-dim/60 hover:text-brand-dim border-0 bg-transparent cursor-pointer leading-none p-0">
                <i class="pi pi-times text-[8px]"></i>
              </button>
            </span>
          }
          <input
            class="bg-transparent border-0 outline-none text-xs text-white/65 placeholder-white/20 min-w-[80px]"
            placeholder="Add tag…"
            [ngModel]="editorTagInput()"
            (ngModelChange)="editorTagInput.set($event)"
            (keydown)="onTagInputKeydown($event)" />
        </div>
      </div>

    </div>

    <!-- Toolbar -->
    <div class="flex items-center gap-0.5 px-3 py-1.5 border-b border-white/[0.05] shrink-0 flex-wrap">
      @if (!markdownMode()) {
        <button (click)="undo()" class="tbtn" title="Undo"><i class="pi pi-undo text-[12px]"></i></button>
        <button (click)="redo()" class="tbtn" title="Redo"><i class="pi pi-redo text-[12px]"></i></button>

        <div class="w-px h-4 bg-white/10 mx-1 shrink-0"></div>

        <button (click)="toggleBold()" [class.active]="isBold()" class="tbtn font-bold text-[13px]" title="Bold">B</button>
        <button (click)="toggleItalic()" [class.active]="isItalic()" class="tbtn italic text-[13px]" title="Italic">I</button>
        <button (click)="toggleUnderline()" [class.active]="isUnderline()" class="tbtn underline text-[13px]" title="Underline">U</button>

        <div class="w-px h-4 bg-white/10 mx-1 shrink-0"></div>

        <button (click)="toggleH1()" [class.active]="isH1()" class="tbtn font-bold text-[11px] tracking-tight" title="Heading 1">H1</button>
        <button (click)="toggleH2()" [class.active]="isH2()" class="tbtn font-bold text-[11px] tracking-tight" title="Heading 2">H2</button>
        <button (click)="toggleH3()" [class.active]="isH3()" class="tbtn font-bold text-[11px] tracking-tight" title="Heading 3">H3</button>

        <div class="w-px h-4 bg-white/10 mx-1 shrink-0"></div>

        <button (click)="toggleBulletList()" [class.active]="isBulletList()" class="tbtn" title="Bullet List"><i class="pi pi-list text-[12px]"></i></button>
        <button (click)="toggleOrderedList()" [class.active]="isOrderedList()" class="tbtn" title="Numbered List"><i class="pi pi-sort-numeric-up-alt text-[12px]"></i></button>

        <div class="w-px h-4 bg-white/10 mx-1 shrink-0"></div>

        <button (click)="toggleBlockquote()" [class.active]="isBlockquote()" class="tbtn" title="Quote"><i class="pi pi-comments text-[12px]"></i></button>
        <button (click)="toggleCode()" [class.active]="isCode()" class="tbtn" title="Inline Code"><i class="pi pi-code text-[12px]"></i></button>
        <button (click)="toggleCodeBlock()" [class.active]="isCodeBlock()" class="tbtn font-mono text-[10px]" title="Code Block">&#123;&#125;</button>

        <div class="w-px h-4 bg-white/10 mx-1 shrink-0"></div>

        <button (click)="openLinkInput()" class="tbtn" title="Link"><i class="pi pi-link text-[12px]"></i></button>
        <button (click)="insertHR()" class="tbtn" title="Divider"><i class="pi pi-minus text-[12px]"></i></button>
        <button (click)="insertTable()" class="tbtn" title="Table"><i class="pi pi-table text-[12px]"></i></button>

        <div class="w-px h-4 bg-white/10 mx-1 shrink-0"></div>

        <button (click)="triggerFileUpload()" [class.uploading]="uploadingFile()" class="tbtn" title="Insert image or file">
          @if (uploadingFile()) {
            <i class="pi pi-spinner pi-spin text-[12px]"></i>
          } @else {
            <i class="pi pi-image text-[12px]"></i>
          }
        </button>

        <div class="w-px h-4 bg-white/10 mx-1 shrink-0"></div>
      }

      <button (click)="toggleMarkdownMode()" [class.active]="markdownMode()"
        class="tbtn font-mono text-[10px] tracking-tight px-1.5" title="Toggle markdown source">
        MD
      </button>
    </div>

    <!-- Remote update conflict banner -->
    @if (remoteUpdatePending()) {
      <div class="flex items-center gap-3 px-6 py-2.5 bg-amber-500/10 border-b border-amber-500/20 shrink-0">
        <i class="pi pi-exclamation-triangle text-amber-400 text-sm shrink-0"></i>
        <span class="text-sm text-amber-300/90 flex-1">This page was updated by someone else.</span>
        <button (click)="fetchLatest()"
          class="text-xs text-amber-400 hover:text-amber-300 font-medium px-3 py-1 rounded bg-amber-500/20 hover:bg-amber-500/30 transition-colors border-0 cursor-pointer whitespace-nowrap">
          Fetch latest
        </button>
        <span class="text-xs text-white/25">or</span>
        <button (click)="dismissRemoteUpdate()"
          class="text-xs text-white/40 hover:text-white/65 border-0 bg-transparent cursor-pointer px-1 whitespace-nowrap">
          Keep my changes
        </button>
      </div>
    }

    <!-- Link input bar -->
    @if (linkInputVisible()) {
      <div class="flex items-center gap-2 px-6 py-2 border-b border-brand/20 bg-brand/[0.05] shrink-0">
        <i class="pi pi-link text-xs text-brand-dim"></i>
        <input #linkInputEl
          class="flex-1 bg-transparent border-0 outline-none text-sm text-white/80 placeholder-white/25"
          placeholder="https://…"
          [ngModel]="linkUrl()"
          (ngModelChange)="linkUrl.set($event)"
          (keydown.enter)="applyLink()"
          (keydown.escape)="linkInputVisible.set(false)" />
        <button (click)="applyLink()"
          class="text-xs text-brand-dim hover:text-brand px-2 py-1 rounded hover:bg-brand/10 transition-colors border-0 bg-transparent cursor-pointer">
          Apply
        </button>
        <button (click)="linkInputVisible.set(false)"
          class="text-xs text-white/40 hover:text-white/65 border-0 bg-transparent cursor-pointer px-1">
          Cancel
        </button>
      </div>
    }

    <!-- Hidden file input -->
    <input #fileInputEl type="file" class="hidden"
      accept="image/*,application/pdf,.doc,.docx,.xls,.xlsx,.csv,.txt,.zip,.rar"
      multiple
      (change)="onFilesSelected($event)" />

    <!-- Markdown source editor -->
    @if (markdownMode()) {
      <div class="flex-1 min-h-0 overflow-y-auto"
           style="scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.08) transparent;">
        <div class="max-w-3xl mx-auto px-8 py-4 h-full">
          <textarea
            class="w-full h-full min-h-[400px] bg-transparent border-0 outline-none resize-none font-mono text-sm text-white/80 placeholder-white/20 leading-relaxed"
            placeholder="Write markdown here…"
            [ngModel]="rawMarkdown()"
            (ngModelChange)="rawMarkdown.set($event)"
            style="scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.08) transparent;">
          </textarea>
        </div>
      </div>
    }

    <!-- WYSIWYG editor -->
    <div class="flex-1 min-h-0 overflow-y-auto"
         [hidden]="markdownMode()"
         style="scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.08) transparent;">
      <div class="max-w-3xl mx-auto px-8 py-4">
        <div #editorEl class="wiki-content wiki-wysiwyg"></div>
      </div>
    </div>

  </div>
</div>
