@if (open()) {
    <div (click)="closed.emit()" class="fixed inset-0 z-50 overflow-y-auto bg-black/60 thin-scrollbar">
        <div
            (click)="$event.stopPropagation()"
            class="mx-auto my-[8vh] w-full max-w-4xl overflow-hidden rounded-2xl border border-border bg-card shadow-2xl"
        >
            <!-- Header -->
            <div class="flex items-start gap-3 border-b border-white/[0.08] px-5 py-4">
                <div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-brand/10 text-brand-dim">
                    <i class="pi pi-clone text-[0.8125rem]"></i>
                </div>
                <div class="min-w-0 flex-1">
                    <h2 class="text-[0.9375rem] font-semibold text-text-primary">
                        {{ 'WIKI.TEMPLATE.PICKER_TITLE' | translate }}
                    </h2>
                    <p class="mt-0.5 text-[0.75rem] text-text-muted">
                        {{ 'WIKI.TEMPLATE.PICKER_SUBTITLE' | translate }}
                    </p>
                </div>
                <button
                    (click)="closed.emit()"
                    class="shrink-0 cursor-pointer rounded-md border border-border bg-transparent px-1.5 py-0.5 text-[0.625rem] text-text-muted hover:text-text-secondary"
                >
                    esc
                </button>
            </div>

            <!-- Cards -->
            <div class="grid grid-cols-1 gap-3 p-5 sm:grid-cols-2 lg:grid-cols-3">
                @for (card of cards; track card.template.id) {
                    <button
                        (click)="choose(card.template)"
                        [class]="
                            card.preview.length ? 'border-white/[0.06] bg-app-bg/40' : 'border-dashed border-white/[0.12] bg-transparent'
                        "
                        class="group/card flex cursor-pointer flex-col rounded-xl border p-4 text-left transition-all hover:border-brand/30 hover:bg-white/[0.04]"
                    >
                        <span class="flex items-start gap-2.5">
                            <span
                                class="flex h-7 w-7 shrink-0 items-center justify-center rounded-lg bg-white/[0.06] text-text-secondary transition-colors group-hover/card:bg-brand/15 group-hover/card:text-brand-dim"
                            >
                                <i [class]="card.template.icon" class="pi text-[0.75rem]"></i>
                            </span>
                            <span class="min-w-0 flex-1">
                                <span class="block truncate text-[0.8125rem] font-semibold text-text-primary">
                                    {{ card.template.nameKey | translate }}
                                </span>
                                <!-- Two lines, always: prevents cards in a row from ending up different heights. -->
                                <span class="mt-0.5 line-clamp-2 block h-[2.125rem] text-[0.6875rem] leading-snug text-text-muted">
                                    {{ card.template.descriptionKey | translate }}
                                </span>
                            </span>
                        </span>

                        <!-- Thumbnail. Real strings at thumbnail size rather than grey bars: the point of a preview is to answer "is this the one" without opening it. `mt-auto` sits it against the bottom of the card; the height comes from PREVIEW_ROWS at `h-3` plus the gaps between them plus the padding. -->
                        <span
                            class="mt-auto flex h-[6.5rem] flex-col gap-1.5 overflow-hidden rounded-lg border border-white/[0.05] bg-app-bg/60 px-2.5 pb-2 pt-3"
                        >
                            <!-- Every row is `h-3 shrink-0`: unshrinkable, so a row that doesn't fit is simply clipped by the overflow instead of every row flattening to fit. -->
                            @for (row of card.preview; track $index) {
                                @switch (row.shape) {
                                    @case ('heading') {
                                        <span
                                            class="flex h-3 shrink-0 items-center truncate text-[0.5625rem] font-semibold text-text-secondary"
                                        >
                                            {{ row.textKey! | translate }}
                                        </span>
                                    }
                                    @case ('bullet') {
                                        <span class="flex h-3 shrink-0 items-center gap-1.5">
                                            <span class="h-1 w-1 shrink-0 rounded-full bg-white/25"></span>
                                            <span class="truncate text-[0.5625rem] text-text-muted">
                                                {{ row.textKey! | translate }}
                                            </span>
                                        </span>
                                    }
                                    @case ('task') {
                                        <span class="flex h-3 shrink-0 items-center gap-1.5">
                                            <span class="h-1.5 w-1.5 shrink-0 rounded-[0.125rem] border border-white/25"></span>
                                            <span class="truncate text-[0.5625rem] text-text-muted">
                                                {{ row.textKey! | translate }}
                                            </span>
                                        </span>
                                    }
                                    @case ('quote') {
                                        <span
                                            class="flex h-3 shrink-0 items-center truncate border-l-2 border-brand/40 pl-1.5 text-[0.5625rem] text-text-muted"
                                        >
                                            {{ row.textKey! | translate }}
                                        </span>
                                    }
                                    @case ('grid') {
                                        <span class="grid h-3 shrink-0 grid-cols-3 items-center gap-1">
                                            @for (cell of gridCells; track cell) {
                                                <span class="h-1 rounded-full bg-white/15"></span>
                                            }
                                        </span>
                                    }
                                    @default {
                                        <span class="flex h-3 shrink-0 items-center truncate text-[0.5625rem] text-text-muted">
                                            @if (row.textKey) {
                                                {{ row.textKey | translate }}
                                            } @else {
                                                {{ row.text }}
                                            }
                                        </span>
                                    }
                                }
                            } @empty {
                                <span class="flex flex-1 items-center justify-center text-[0.625rem] text-text-faint">
                                    {{ 'WIKI.TEMPLATE.BLANK.PREVIEW' | translate }}
                                </span>
                            }
                        </span>
                    </button>
                }
            </div>
        </div>
    </div>
}
