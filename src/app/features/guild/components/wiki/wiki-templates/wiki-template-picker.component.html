@if (open()) {
    <div (click)="closed.emit()" class="fixed inset-0 z-50 overflow-y-auto bg-black/60 thin-scrollbar">
        <div (click)="$event.stopPropagation()"
             class="mx-auto my-[8vh] w-full max-w-4xl overflow-hidden rounded-2xl border
                    border-border bg-card shadow-2xl">

            <!-- Header -->
            <div class="flex items-start gap-3 border-b border-white/[0.08] px-5 py-4">
                <div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg
                            bg-brand/10 text-brand-dim">
                    <i class="pi pi-clone text-[0.8125rem]"></i>
                </div>
                <div class="min-w-0 flex-1">
                    <h2 class="text-[0.9375rem] font-semibold text-white/85">
                        {{ 'WIKI.TEMPLATE.PICKER_TITLE' | translate }}
                    </h2>
                    <p class="mt-0.5 text-[0.75rem] text-white/40">
                        {{ 'WIKI.TEMPLATE.PICKER_SUBTITLE' | translate }}
                    </p>
                </div>
                <button (click)="closed.emit()"
                        class="shrink-0 cursor-pointer rounded-md border border-border bg-transparent
                               px-1.5 py-0.5 text-[0.625rem] text-white/30 hover:text-white/60">
                    esc
                </button>
            </div>

            <!-- Cards -->
            <div class="grid grid-cols-1 gap-3 p-5 sm:grid-cols-2 lg:grid-cols-3">
                @for (card of cards; track card.template.id) {
                    <button (click)="choose(card.template)"
                            [class]="card.preview.length
                                ? 'border-white/[0.06] bg-app-bg/40'
                                : 'border-dashed border-white/[0.12] bg-transparent'"
                            class="group/card flex cursor-pointer flex-col rounded-xl border p-4
                                   text-left transition-all hover:border-brand/30
                                   hover:bg-white/[0.04]">

                        <span class="flex items-start gap-2.5">
                            <span class="flex h-7 w-7 shrink-0 items-center justify-center
                                         rounded-lg bg-white/[0.06] text-white/45
                                         transition-colors group-hover/card:bg-brand/15
                                         group-hover/card:text-brand-dim">
                                <i [class]="card.template.icon" class="pi text-[0.75rem]"></i>
                            </span>
                            <span class="min-w-0 flex-1">
                                <span class="block truncate text-[0.8125rem] font-semibold text-white/85">
                                    {{ card.template.nameKey | translate }}
                                </span>
                                <span class="mt-0.5 block text-[0.6875rem] leading-snug text-white/40">
                                    {{ card.template.descriptionKey | translate }}
                                </span>
                            </span>
                        </span>

                        <!-- Thumbnail. Real strings at thumbnail size rather than grey bars: the
                             point of a preview is to answer "is this the one" without opening it. -->
                        <span class="mt-3 flex h-[4.5rem] flex-col gap-1.5 overflow-hidden rounded-lg
                                     border border-white/[0.05] bg-app-bg/60 px-2.5 py-2">
                            @for (row of card.preview; track $index) {
                                @switch (row.shape) {
                                    @case ('heading') {
                                        <span class="truncate text-[0.5625rem] font-semibold text-white/50">
                                            {{ row.textKey! | translate }}
                                        </span>
                                    }
                                    @case ('bullet') {
                                        <span class="flex items-center gap-1.5">
                                            <span class="h-1 w-1 shrink-0 rounded-full bg-white/25"></span>
                                            <span class="truncate text-[0.5625rem] text-white/30">
                                                {{ row.textKey! | translate }}
                                            </span>
                                        </span>
                                    }
                                    @case ('task') {
                                        <span class="flex items-center gap-1.5">
                                            <span class="h-1.5 w-1.5 shrink-0 rounded-[0.125rem]
                                                         border border-white/25"></span>
                                            <span class="truncate text-[0.5625rem] text-white/30">
                                                {{ row.textKey! | translate }}
                                            </span>
                                        </span>
                                    }
                                    @case ('quote') {
                                        <span class="truncate border-l-2 border-brand/40 pl-1.5
                                                     text-[0.5625rem] text-white/30">
                                            {{ row.textKey! | translate }}
                                        </span>
                                    }
                                    @case ('grid') {
                                        <span class="grid grid-cols-3 gap-1">
                                            @for (cell of gridCells; track cell) {
                                                <span class="h-1 rounded-full bg-white/15"></span>
                                            }
                                        </span>
                                    }
                                    @default {
                                        <span class="truncate text-[0.5625rem] text-white/25">
                                            @if (row.textKey) {
                                                {{ row.textKey | translate }}
                                            } @else {
                                                {{ row.text }}
                                            }
                                        </span>
                                    }
                                }
                            } @empty {
                                <span class="flex flex-1 items-center justify-center
                                             text-[0.625rem] text-white/20">
                                    {{ 'WIKI.TEMPLATE.BLANK.PREVIEW' | translate }}
                                </span>
                            }
                        </span>
                    </button>
                }
            </div>
        </div>
    </div>
}
