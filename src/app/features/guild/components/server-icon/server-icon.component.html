<div class="relative shrink-0">
  <button
    class="w-11 h-11 flex items-center justify-center transition-all border-0 cursor-pointer text-sm font-bold overflow-hidden"
    [ngClass]="serverData().isActive
      ? 'rounded-2xl bg-indigo-500 text-white'
      : 'rounded-full bg-white/[0.07] text-white/60 hover:rounded-2xl hover:bg-indigo-500 hover:text-white'">
    @if (serverData().icon && !imgFailed()) {
      <img [src]="imgSrc()" (error)="onImgError()" alt="" class="w-full h-full object-cover" />
    } @else {
      {{ serverData().name[0]?.toUpperCase() }}
    }
  </button>
  @if (serverData().badge) {
    <span class="absolute -top-0.5 -right-0.5 min-w-[18px] h-[18px] px-1 rounded-full bg-rose-500 text-white text-[10px] font-bold flex items-center justify-center pointer-events-none">
      {{ serverData().badge }}
    </span>
  }
  @if (serverData().hasUnread && !serverData().isActive) {
    <span class="absolute -bottom-0.5 -left-0.5 w-3 h-3 rounded-full bg-white border-2 border-app-bg pointer-events-none"></span>
  }
</div>
