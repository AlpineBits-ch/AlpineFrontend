<div class="relative shrink-0">
    <button
        [ngClass]="['rounded-icon', !serverData().icon || imgFailed() ? fallbackColorClass() : 'bg-white/[0.07] text-white/60']"
        class="w-11 h-11 flex items-center justify-center border-0 cursor-pointer text-sm font-bold overflow-hidden"
    >
        @if (serverData().icon && !imgFailed()) {
            <img (error)="onImgError()" [src]="imgSrc()" alt="" class="w-full h-full object-cover" />
        } @else {
            {{ serverData().name[0]?.toUpperCase() }}
        }
    </button>
    @if (serverData().badge) {
        <span
            class="absolute -top-0.5 -right-0.5 min-w-[18px] h-[18px] px-1 rounded-full bg-rose-500 text-white text-[10px] font-bold flex items-center justify-center pointer-events-none"
        >
            {{ serverData().badge }}
        </span>
    }
    <!-- Voice occupancy: bottom of the icon so it never fights the mention badge above it, in online green since being in voice isn't something to be alerted about. -->
    @if (serverData().voiceCount; as voiceCount) {
        <span
            [attr.data-testid]="'guild-voice-pip'"
            [attr.title]="voiceCount + ' in voice'"
            class="absolute -bottom-0.5 -right-0.5 h-[1rem] min-w-[1rem] px-1 rounded-full bg-sidebar border border-app-bg flex items-center gap-0.5 text-[0.5625rem] font-bold leading-none pointer-events-none"
            [ngClass]="serverData().hasStream ? 'text-red-400' : 'text-online'"
        >
            <i [ngClass]="serverData().hasStream ? 'pi-desktop' : 'pi-volume-up'" class="pi text-[0.4375rem]"></i>
            {{ voiceCount }}
        </span>
    }
</div>
