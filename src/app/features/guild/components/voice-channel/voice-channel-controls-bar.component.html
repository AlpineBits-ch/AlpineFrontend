<div class="shrink-0 border-t border-white/[0.10] bg-sidebar px-4 py-4 flex items-center justify-center gap-3">

  <!-- Mute -->
  <button
    (click)="muteToggle.emit()"
    class="w-12 h-12 rounded-xl flex items-center justify-center transition-all cursor-pointer border-0"
    [ngClass]="voiceSvc.localState().isMuted
      ? 'bg-rose-500/20 text-rose-400 hover:bg-rose-500/30'
      : 'bg-white/[0.07] text-white/60 hover:bg-white/[0.12] hover:text-white/80'"
    [title]="voiceSvc.localState().isMuted ? 'Unmute' : 'Mute'">
    <i class="pi text-base"
       [ngClass]="voiceSvc.localState().isMuted ? 'pi-microphone-slash' : 'pi-microphone'"></i>
  </button>

  <!-- Deafen -->
  <button
    (click)="deafenToggle.emit()"
    class="w-12 h-12 rounded-xl flex items-center justify-center transition-all cursor-pointer border-0"
    [ngClass]="voiceSvc.localState().isDeafened
      ? 'bg-rose-500/20 text-rose-400 hover:bg-rose-500/30'
      : 'bg-white/[0.07] text-white/60 hover:bg-white/[0.12] hover:text-white/80'"
    [title]="voiceSvc.localState().isDeafened ? 'Undeafen' : 'Deafen'">
    <i class="pi pi-volume-off text-base"></i>
  </button>

  <!-- Camera -->
  <button
    (click)="cameraToggle.emit()"
    class="w-12 h-12 rounded-xl flex items-center justify-center transition-all cursor-pointer border-0"
    [ngClass]="voiceSvc.localState().isCameraOn
      ? 'bg-brand/20 text-brand-dim hover:bg-brand/30'
      : 'bg-white/[0.07] text-white/60 hover:bg-white/[0.12] hover:text-white/80'"
    [title]="voiceSvc.localState().isCameraOn ? 'Turn off camera' : 'Turn on camera'">
    <i class="pi pi-camera text-base"></i>
  </button>

  <!-- Screen share -->
  <button
    (click)="screenShareToggle.emit()"
    class="w-12 h-12 rounded-xl flex items-center justify-center transition-all cursor-pointer border-0"
    [ngClass]="voiceSvc.localState().isScreenSharing
      ? 'bg-brand/20 text-brand-dim hover:bg-brand/30'
      : 'bg-white/[0.07] text-white/60 hover:bg-white/[0.12] hover:text-white/80'"
    [title]="voiceSvc.localState().isScreenSharing ? 'Stop sharing' : 'Share screen'">
    <i class="pi pi-desktop text-base"></i>
  </button>

  <!-- FPS selector — visible only while sharing -->
  @if (voiceSvc.localState().isScreenSharing) {
    <div class="flex items-center gap-0.5 bg-white/[0.05] rounded-lg px-1 py-1 border border-white/[0.08]">
      @for (fps of fpsList; track fps) {
        <button
          (click)="fpsChange.emit(fps)"
          class="px-2 py-1 rounded text-xs font-mono transition-colors border-0 cursor-pointer leading-none"
          [ngClass]="rustMedia.captureFps() === fps
            ? 'bg-brand text-white'
            : 'bg-transparent text-white/45 hover:text-white/75 hover:bg-white/[0.07]'"
          [title]="fps + ' fps'">{{ fps }}</button>
      }
    </div>
  }

  <div class="w-px h-7 bg-white/[0.12] mx-1"></div>

  <!-- Disconnect -->
  <button
    (click)="disconnect.emit()"
    class="w-12 h-12 rounded-xl flex items-center justify-center bg-rose-500/15 hover:bg-rose-500/25 text-rose-400 hover:text-rose-300 transition-all cursor-pointer border-0"
    title="Disconnect">
    <i class="pi pi-phone text-base" style="transform: rotate(135deg); display: inline-block;"></i>
  </button>

</div>
