<div class="flex h-full flex-col overflow-hidden bg-app-bg">

    <!-- Header -->
    <header class="app-header flex shrink-0 items-center border-b border-border-subtle bg-app-bg px-3 sm:px-5">
        <button (click)="navService.mobileNavOpen.set(true)"
                [attr.aria-label]="'CALL.OPEN_NAVIGATION' | translate"
                class="call-focusable mr-1 flex size-8 shrink-0 cursor-pointer items-center justify-center rounded-lg
                       border-0 bg-transparent text-white/50 transition-colors hover:bg-white/[0.07] lg:hidden"
                type="button">
            <i class="pi pi-bars text-sm"></i>
        </button>
        <div class="flex min-w-0 items-center gap-2 sm:gap-3">
            <i aria-hidden="true" class="pi pi-volume-up shrink-0 text-white/35"></i>
            <span class="truncate text-sm font-semibold text-white/85">{{ channel().name }}</span>
            @if (participants().length > 0) {
                <span class="shrink-0 text-xs text-white/40">· {{ ('CALL.CONNECTED_COUNT' | translate: {count: participants().length}) }}</span>
            }
        </div>
    </header>

    <!-- Content -->
    @if (!isJoined()) {

        <!-- Lobby view -->
        <app-voice-channel-lobby
                (joinVoice)="joinChannel()"
                [channel]="channel()"
                [participants]="participants()"
                class="min-h-0 flex-1"
        />

    } @else {

        <!-- Connected view. One status row, then the stage, then the controls - the same three
             parts in the same order as the DM call panel. This used to be up to three stacked
             banner strips of its own design. See call-status.ts. -->
        <div class="relative flex min-h-0 flex-1 flex-col overflow-hidden">

            <app-call-status-bar
                    [meta]="('CALL.CONNECTED_COUNT' | translate: {count: participants().length})"
                    [rtcState]="voiceSvc.rtcState()"
                    [stalledAudio]="audio.anyStalled()"/>

            <div class="relative min-h-0 flex-1">
                @if (callScreenShares().length > 0) {
                    <app-call-screen-layout
                            (localAudioToggle)="toggleLocalScreenAudio()"
                            (participantContextMenu)="onParticipantContextMenu($event.event, $event.participant)"
                            (remoteAudioToggle)="toggleRemoteScreenAudio($event)"
                            [participants]="callParticipants()"
                            [participantsWithAudio]="voiceSvc.participantsWithAudio()"
                            [screenShares]="callScreenShares()"
                            [watchScope]="watchScope()"
                            class="h-full w-full"
                    />
                } @else {
                    <div class="thin-scrollbar flex h-full w-full items-center justify-center overflow-y-auto
                                bg-stage p-6 pb-call-controls">
                        <div [class]="'grid w-full justify-center gap-6 ' + participantGridClass()">
                            @for (p of participants(); track p.userId) {
                                <app-call-participant-tile
                                        (contextMenu)="onParticipantContextMenu($event, p)"
                                        [audioState]="audio.stateOf(p.userId)"
                                        [participant]="p"
                                        [videoStream]="p.isLocal ? voiceSvc.localVideoStream() : voiceSvc.getVideoStream(p.userId)"
                                />
                            }
                        </div>
                    </div>
                }

                <!-- Floating controls bar -->
                <div class="pointer-events-none absolute bottom-8 left-0 right-0 z-20 flex justify-center">
                    <app-call-controls-bar
                            (cameraToggle)="toggleCamera()"
                            (deafenToggle)="toggleDeafen()"
                            (disconnect)="leaveChannel()"
                            (muteToggle)="toggleMute()"
                            (presetChange)="setScreenPreset($event)"
                            (screenAudioToggle)="toggleLocalScreenAudio()"
                            (screenShareToggle)="toggleScreenShare()"
                            [disconnectLabel]="'CALL.DISCONNECT' | translate"
                            [isCameraOn]="voiceSvc.localState().isCameraOn"
                            [isDeafened]="voiceSvc.localState().isDeafened"
                            [isMuted]="voiceSvc.localState().isMuted"
                            [isScreenSharing]="voiceSvc.localState().isScreenSharing"
                            [preset]="voiceSvc.rtc.screenPreset()"
                            [screenAudioMuted]="voiceSvc.localScreenAudioMuted()"
                            [screenHasAudio]="voiceSvc.localScreenHasAudio()"
                            class="pointer-events-auto"
                    />
                </div>
            </div>

        </div>

    }

</div>

<!-- Context menu -->
@if (participantMenu(); as menu) {
    <app-call-context-menu
            (ban)="banParticipant()"
            (close)="participantMenu.set(null)"
            (kick)="kickParticipant()"
            (serverDeafen)="toggleServerDeafen()"
            (volumeChange)="onVolumeChange($event)"
            [isSuperadmin]="isSuperadmin()"
            [menu]="menu"
            [moderationEnabled]="hasModeration()"
    />
}
