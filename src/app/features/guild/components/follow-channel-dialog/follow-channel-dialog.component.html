<p-dialog
        [(visible)]="visible"
        (onHide)="close()"
        [closable]="true" [dismissableMask]="true" [draggable]="false" [modal]="true"
        [resizable]="false" [style]="{width: '420px'}"
        appendTo="body">
    <ng-template pTemplate="header">
        <span class="text-sm font-semibold text-text-primary">
            {{ 'FOLLOW_CHANNEL.TITLE' | translate:{channel: sourceChannelName()} }}
        </span>
    </ng-template>

    <div class="py-2 space-y-5">

        <p class="text-xs text-text-secondary leading-relaxed m-0">
            {{ 'FOLLOW_CHANNEL.EXPLANATION' | translate }}
        </p>

        <!-- Destination server -->
        <div>
            <label class="block text-xs font-semibold text-text-muted uppercase tracking-widest mb-2">
                {{ 'FOLLOW_CHANNEL.SELECT_SERVER_LABEL' | translate }}
            </label>
            <p-select (ngModelChange)="onGuildChange($event)"
                      [ngModel]="selectedGuildId()"
                      [options]="guildOptions()"
                      [placeholder]="'FOLLOW_CHANNEL.SELECT_SERVER_PLACEHOLDER' | translate"
                      [style]="{width: '100%'}"
                      optionLabel="label"
                      optionValue="value"/>
        </div>

        <!-- Destination channel -->
        <div>
            <label class="block text-xs font-semibold text-text-muted uppercase tracking-widest mb-2">
                {{ 'FOLLOW_CHANNEL.SELECT_CHANNEL_LABEL' | translate }}
            </label>
            <p-select (ngModelChange)="onChannelChange($event)"
                      [disabled]="!selectedGuildId()"
                      [ngModel]="selectedChannelId()"
                      [options]="channelOptions()"
                      [placeholder]="'FOLLOW_CHANNEL.SELECT_CHANNEL_PLACEHOLDER' | translate"
                      [style]="{width: '100%'}"
                      optionLabel="label"
                      optionValue="value"/>
        </div>

        @if (inlineError(); as error) {
            <div class="flex items-start gap-2 text-xs text-offline bg-offline/10 border border-offline/20 rounded-lg px-3 py-2">
                <i class="pi pi-exclamation-circle mt-0.5"></i>
                <span>{{ error }}</span>
            </div>
        }

    </div>

    <div class="flex gap-2 justify-end mt-4 pt-4 border-t border-border-subtle">
        <p-button (onClick)="close()" [label]="'FOLLOW_CHANNEL.CANCEL' | translate" severity="secondary"
                  size="small"/>
        <p-button (onClick)="confirm()" [disabled]="!canConfirm()" [label]="'FOLLOW_CHANNEL.CONFIRM' | translate"
                  [loading]="submitting()"
                  severity="primary"
                  size="small"/>
    </div>
</p-dialog>
