@let rs = readState();

<div
    (dragend)="drag.onDragEnd($event)"
    (dragover)="drag.onItemDragOver($event, channel().id)"
    (dragstart)="drag.onChannelDragStart($event, channel())"
    data-testid="channel-list-item"
    [attr.data-channel-id]="channel().id"
    [attr.draggable]="canReorder() ? 'true' : null"
>
    <button
        (click)="open.emit()"
        (contextmenu)="openMenu.emit($event)"
        [class.cursor-grab]="canReorder()"
        [class.is-active]="isActive()"
        [class.is-unread]="!isActive() && showsReadState() && rs.isUnread"
        class="chan-row"
    >
        <app-channel-icon [channel]="channel()" />
        <span class="chan-label pointer-events-none">{{ channel().name }}</span>
        @if (showsReadState() && rs.mentionCount > 0) {
            <span class="chan-badge chan-badge-mention pointer-events-none">{{ rs.mentionCount }}</span>
        }
        <!-- Something unsent is waiting here. Quiet, and never on the channel you are looking at. -->
        @if (hasDraft()) {
            <i
                [attr.aria-label]="'COMPOSER.DRAFT_WAITING' | translate"
                [title]="'COMPOSER.DRAFT_WAITING' | translate"
                class="pi pi-pencil chan-draft pointer-events-none"
            ></i>
        }
        @if (channel().isPrivate) {
            <i class="pi pi-lock chan-lock pointer-events-none"></i>
        }
    </button>
</div>
