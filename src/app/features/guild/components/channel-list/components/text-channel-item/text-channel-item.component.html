@let rs = readState();

<div (dragend)="drag.onDragEnd($event)"
     (dragover)="drag.onItemDragOver($event, channel().id)"
     (dragstart)="drag.onChannelDragStart($event, channel())"
     [attr.draggable]="canReorder() ? 'true' : null">
    <button
            (click)="open.emit()"
            (contextmenu)="openMenu.emit($event)"
            [class.cursor-grab]="canReorder()"
            [ngClass]="isActive() ? 'bg-white/[0.08] text-white/95' : rs.isUnread ? 'text-white/90 font-semibold hover:bg-white/[0.06] hover:text-white' : 'text-white/55 hover:bg-white/[0.06] hover:text-white/90'"
            class="w-full flex items-center gap-2.5 px-2 py-[7px] rounded-lg text-left transition-all border-0 cursor-pointer">
        @if (channel().type === ChannelType.Forum) {
            <i class="pi pi-align-left text-white/35 text-[17px] shrink-0 pointer-events-none"></i>
        } @else if (channel().type === ChannelType.Announcement) {
            <i class="pi pi-megaphone text-white/35 text-[17px] shrink-0 pointer-events-none"></i>
        } @else {
            <span class="text-white/35 text-[25px] leading-none font-medium shrink-0 pointer-events-none">#</span>
        }
        <span class="text-[0.8rem] font-medium truncate flex-1 pointer-events-none">{{ channel().name }}</span>
        @if (rs.mentionCount > 0) {
            <span class="min-w-[18px] h-[18px] px-1 rounded-full bg-rose-500 text-white text-[10px] font-bold flex items-center justify-center shrink-0 pointer-events-none">
                {{ rs.mentionCount }}
            </span>
        }
        @if (channel().isPrivate) {
            <i class="pi pi-lock text-[11px] text-white/35 shrink-0 pointer-events-none"></i>
        }
    </button>
</div>
