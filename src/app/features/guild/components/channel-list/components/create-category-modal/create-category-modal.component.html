<p-dialog
    [(visible)]="isVisible"
    [closable]="true"
    [dismissableMask]="true"
    [draggable]="false"
    [modal]="true"
    [resizable]="false"
    [style]="{width: '360px'}"
    appendTo="body"
>
    <ng-template pTemplate="header">
        <span class="text-sm font-semibold text-text-primary">{{ 'GUILD.CREATE_CATEGORY' | translate }}</span>
    </ng-template>
    <div class="py-2 space-y-4">
        <div>
            <label class="block text-xs font-semibold text-text-muted uppercase tracking-widest mb-2">{{
                'GUILD.CATEGORY_NAME' | translate
            }}</label>
            <input
                (ngModelChange)="name.set($event)"
                (keydown.enter)="submit()"
                [ngModel]="name()"
                [placeholder]="'GUILD.CATEGORY_NAME_PLACEHOLDER' | translate"
                class="w-full"
                pInputText
            />
        </div>
    </div>
    <div class="flex gap-2 justify-end mt-4 pt-4 border-t border-white/[0.06]">
        <p-button (onClick)="isVisible.set(false)" [label]="'GUILD.CANCEL' | translate" severity="secondary" size="small" />
        <p-button
            (onClick)="submit()"
            [disabled]="!name().trim()"
            [label]="'GUILD.CREATE_CATEGORY_SUBMIT' | translate"
            [loading]="creating()"
            severity="primary"
            size="small"
        />
    </div>
</p-dialog>
