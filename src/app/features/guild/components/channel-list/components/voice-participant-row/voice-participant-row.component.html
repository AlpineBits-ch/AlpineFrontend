@let p = participant();

<div (click)="open.emit()"
     (contextmenu)="openMenu.emit($event)"
     data-testid="voice-participant"
     [attr.data-user-id]="p.userId"
     class="flex items-center gap-2 pl-7 pr-2 py-0.5 rounded-md hover:bg-white/[0.04] cursor-pointer transition-colors">
    <div class="flex shrink-0">
        <app-avatar [label]="p.avatarLabel" [userId]="p.userId"
                    [styleClass]="p.isSpeaking ? '!w-5 !h-5 !text-[9px] speaking-ring' : '!w-5 !h-5 !text-[9px]'"/>
    </div>
    <span [ngClass]="p.isSpeaking ? 'text-online/85' : 'text-white/55'"
          class="flex-1 truncate text-[0.8125rem]">
        {{ p.displayName }}
    </span>
    @if (p.isScreenSharing) {
        <app-call-live-badge class="shrink-0" size="sm" variant="soft"/>
    } @else if (p.isMuted) {
        <!-- Drawn slash - PrimeIcons has no slashed microphone, see .icon-slashed. -->
        <span [attr.aria-label]="'CALL.MUTED' | translate"
              class="icon-slashed relative flex shrink-0 items-center justify-center text-[0.5625rem] text-white/35">
            <i class="pi pi-microphone"></i>
        </span>
    }
</div>
