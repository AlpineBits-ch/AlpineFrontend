<!-- No header of its own: the Scenes module row above is the header, and this hangs under it. -->
@if (hasScenes()) {
    @if (open()) {
        <div class="scene-nav-body">
            <app-scene-folder-panel
                (createScene)="createIn($event)"
                (filed)="file($event.channelId, $event.folderId)"
                (picked)="pick($event)"
                [activeChannelId]="activeChannelId()"
                [canManage]="canManage()"
                [guildId]="guildId()"
                [loadingFolderIds]="loadingFolderIds()"
                [partialFolderIds]="partialFolderIds()"
                [recent]="recent()"
                [rootCap]="ROOT_CAP"
                [scenesByFolder]="scenesByFolder()"
                [selected]="folderId()"
                [tree]="tree()"
            />

            <!-- The verb lives inside the tree it acts on, rather than on a header shared with the
                 board, so it cannot read as the next channel's. -->
            @if (canManage() && textChannels().length) {
                <button (click)="createIn(null)" class="scene-nav-new" type="button">
                    <i class="pi pi-plus text-[0.5625rem]"></i>
                    <span>{{ 'SCENE.BOARD.NEW' | translate }}</span>
                </button>
            }
        </div>
    }

    @if (creating()) {
        <app-scene-dialog
            (closed)="creating.set(false); seedFolderId.set(null)"
            [guildChannels]="textChannels()"
            [guildId]="guildId()"
            [seedFolderId]="seedFolderId()"
        />
    }
}
