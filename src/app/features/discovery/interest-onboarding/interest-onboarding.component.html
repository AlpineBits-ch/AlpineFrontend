<div class="mx-auto flex max-w-md flex-col items-center gap-4 px-6 py-10 text-center">
    <i class="pi pi-compass text-3xl text-brand-dim"></i>
    <div>
        <p class="text-sm font-semibold text-text-primary">{{ titleKey() | translate }}</p>
        <p class="mt-1 text-[0.75rem] text-text-muted">{{ 'DISCOVERY.ONBOARDING.SUBTITLE' | translate }}</p>
    </div>

    <div class="w-full text-left">
        <app-topic-picker (selectedChange)="topics.set($event)" [cap]="cap" [selected]="topics()" />
    </div>

    <label class="flex cursor-pointer items-center gap-2 self-start text-[0.75rem] text-text-secondary">
        <input [(ngModel)]="visible" class="accent-brand" type="checkbox" />
        {{ 'DISCOVERY.ONBOARDING.VISIBLE' | translate }}
    </label>

    <div class="flex items-center gap-3">
        <button
            (click)="skip()"
            class="cursor-pointer border-0 bg-transparent text-[0.75rem] text-text-muted hover:text-text-secondary"
            type="button"
        >
            {{ secondaryLabelKey() | translate }}
        </button>
        <p-button
            (onClick)="save()"
            [disabled]="!canSave()"
            [label]="'DISCOVERY.ONBOARDING.SAVE' | translate"
            [loading]="saving()"
            severity="primary"
            size="small"
        />
    </div>
</div>
