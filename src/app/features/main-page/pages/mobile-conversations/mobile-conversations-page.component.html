<div class="flex flex-col h-full bg-app-bg">

    <!-- Header -->
    <div class="shrink-0 flex items-center justify-between px-4 pb-3 border-b border-white/[0.10]"
         style="padding-top: calc(env(safe-area-inset-top) + 0.75rem)">
        <div class="flex items-center gap-2">
            <p-button (onClick)="navService.mobileNavOpen.set(true)" [text]="true" icon="pi pi-bars" severity="secondary"
                      size="small"/>
            <span class="text-[15px] font-semibold text-white/85">Messages</span>
        </div>
        <p-button (onClick)="showNewConversation.set(true)" [text]="true" icon="pi pi-plus" severity="secondary"
                  size="small"/>
    </div>

    <!-- Friends nav -->
    <div class="p-2 pt-3 pb-1">
        <button (click)="navService.showFriends()"
                class="flex items-center gap-2.5 px-3 py-2 rounded-xl text-sm font-medium text-white/55 hover:bg-white/[0.05] hover:text-white/75 w-full text-left transition-all cursor-pointer border-0 bg-transparent">
            <i class="pi pi-users text-sm"></i>
            <span>Friends</span>
            @if (onlineFriendsCount() > 0) {
                <span class="ml-auto text-[11px] bg-brand/25 text-brand-dim px-1.5 py-0.5 rounded-full font-semibold">{{ onlineFriendsCount() }}
                    Online</span>
            }
        </button>
    </div>

    <!-- DMs label -->
    <div class="flex items-center px-4 pt-3 pb-2">
        <span class="text-[10.5px] font-semibold text-white/35 uppercase tracking-widest">Direct Messages</span>
    </div>

    <!-- Conversation list -->
    <div class="flex-1 min-h-0 overflow-y-auto px-2 pb-2"
         style="scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.08) transparent;">
        <app-conversation-list (conversationSelected)="onConversationSelected($event)"/>
    </div>

</div>

<app-new-conversation-dialog [(visible)]="showNewConversation"/>
