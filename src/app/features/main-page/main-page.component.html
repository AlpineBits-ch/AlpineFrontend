<div class="flex flex-col w-screen h-screen overflow-hidden bg-app-bg">

  <!-- Top: Horizontal server bar -->
  <app-server-taskbar (menuToggle)="navService.mobileNavOpen.update(v => !v)"></app-server-taskbar>

  <!-- Body: left sidebar + main content + right sidebar -->
  <div class="flex flex-1 min-h-0 relative">

    <!-- Mobile drawer backdrop -->
    @if (navService.mobileNavOpen()) {
      <div class="fixed inset-0 z-40 bg-black/60 lg:hidden" (click)="navService.mobileNavOpen.set(false)"></div>
    }

    <!-- Left sidebar: always in layout on desktop, overlay drawer on mobile -->
    <div class="fixed top-12 bottom-0 left-0 z-50 transition-transform duration-200
                lg:relative lg:top-auto lg:bottom-auto lg:z-auto lg:!translate-x-0"
         [class.-translate-x-full]="!navService.mobileNavOpen()"
         [class.translate-x-0]="navService.mobileNavOpen()">
      <app-action-sidepanel />
    </div>

    <!-- Main content -->
    <div class="flex-1 min-w-0 overflow-hidden">
      @let view = navService.mainView();
      @switch (view.type) {
        @case ('home') {
          <app-home />
        }
        @case ('conversation') {
          <app-conversation [conversation]="view.conversation" (back)="navService.showHome()" />
        }
        @case ('channel') {
          <!-- Channel view — implement messaging here when ready -->
          <div class="flex flex-col items-center justify-center h-full gap-2">
            <i class="pi pi-hashtag text-3xl text-white/20"></i>
            <span class="text-sm text-white/40">{{ view.channel.name }}</span>
          </div>
        }
      }
    </div>

    <!-- Right sidebar: Activity feed — hidden on mobile/tablet -->
    <div class="hidden xl:flex shrink-0 h-full">
      <app-activity-feed />
    </div>

  </div>
</div>
