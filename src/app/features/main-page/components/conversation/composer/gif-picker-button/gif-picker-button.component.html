<div class="relative">

  <p-button
    class="gif-picker-btn"
    [text]="true"
    [severity]="showPicker() ? 'primary' : 'secondary'"
    size="small"
    (onClick)="toggle()"
    pTooltip="GIF"
    tooltipPosition="top">
    <span class="text-[11px] font-bold px-0.5">GIF</span>
  </p-button>

  @if (showPicker()) {
    <div class="gif-picker-panel absolute bottom-full right-0 mb-2 w-80 bg-[#1a2035] border border-white/[0.08] rounded-xl shadow-2xl overflow-hidden z-50 flex flex-col"
         style="max-height: 360px;">

      <!-- Search bar -->
      <div class="px-3 pt-3 pb-2 shrink-0">
        <input
          type="text"
          placeholder="Search GIFs..."
          [value]="searchQuery()"
          (input)="onSearch($any($event.target).value)"
          class="w-full bg-white/[0.06] border border-white/[0.08] rounded-lg px-3 py-1.5 text-sm text-white/80 placeholder-white/25 outline-none focus:border-white/[0.18] transition-colors"
        />
      </div>

      <!-- Grid -->
      <div class="overflow-y-auto flex-1 px-2 pb-2" style="scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.08) transparent;">
        @if (loading()) {
          <div class="flex items-center justify-center py-8 text-white/25 text-sm">Loading…</div>
        } @else if (gifs().length === 0) {
          <div class="flex items-center justify-center py-8 text-white/25 text-sm">No results</div>
        } @else {
          <div class="grid grid-cols-3 gap-1.5">
            @for (gif of gifs(); track gif.id) {
              <button
                (click)="select(gif)"
                class="aspect-square overflow-hidden rounded-lg border-0 p-0 cursor-pointer hover:ring-2 hover:ring-indigo-500 transition-all bg-white/[0.04]"
                [title]="gif.title">
                <img [src]="gif.previewUrl" [alt]="gif.title" class="w-full h-full object-cover" loading="lazy" />
              </button>
            }
          </div>
        }
      </div>

      <!-- Footer -->
      <div class="px-3 py-1.5 border-t border-white/[0.06] shrink-0 flex items-center justify-end">
        <span class="text-[10px] text-white/20">Powered by GIPHY</span>
      </div>

    </div>
  }

</div>
