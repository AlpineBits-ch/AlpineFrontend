<div class="flex flex-col w-full px-4 py-2">
    <div class="flex items-end w-full bg-surface-200 dark:bg-surface-800 rounded-lg px-4 py-2 gap-3 min-h-[44px]">

        <button class="mb-1 p-link flex items-center justify-center w-6 h-6 rounded-full bg-surface-400 dark:bg-surface-600 hover:bg-primary transition-colors cursor-pointer border-none shrink-0">
            <i class="pi pi-plus text-[10px] text-surface-900 dark:text-surface-0"></i>
        </button>

        <textarea
            #composer
            pTextarea
            [autoResize]="true"
            rows="1"
            placeholder="Message"
            (keydown.enter)="$any($event).shiftKey ? null : $event.preventDefault(); $any($event).shiftKey ? null : handleSendMessage(composer)"
            class="w-full border-none bg-transparent focus:ring-0 focus:shadow-none text-surface-700 dark:text-surface-100 placeholder:text-surface-500 resize-none py-1 max-h-[200px] overflow-y-auto"
        ></textarea>

        <div class="flex items-center gap-3 text-surface-500 dark:text-surface-400 mb-1 shrink-0">
            <i class="pi pi-face-smile hover:text-primary cursor-pointer transition-colors hidden sm:block"></i>

            <p-button
                    icon="pi pi-send"
                    [rounded]="true"
                    [text]="true"
                    severity="secondary"
                    styleClass="hover:text-primary p-0 h-8 w-8"
                    (onClick)="handleSendMessage(composer)">
            </p-button>
        </div>
    </div>

</div>
