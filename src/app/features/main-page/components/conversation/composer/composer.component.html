<div class="relative px-4 py-3">

  <!-- Suggestion overlay (mentions + commands) -->
  <app-suggestion-overlay
    [overlayType]="overlayType()"
    [filteredFriends]="filteredFriends()"
    [filteredCommands]="filteredCommands()"
    [filteredEmojis]="filteredEmojis()"
    [selectedIndex]="selectedIndex()"
    [query]="query()"
    (mentionSelected)="onMentionSelected($event)"
    (commandSelected)="onCommandSelected($event)"
    (emojiSelected)="onEmojiShortcodeSelected($event)" />

  <!-- Active command hint bar -->
  @if (activeCommand()) {
    <div class="flex items-center gap-2 mb-2 px-1">
      <span class="text-[11px] font-bold text-indigo-400">/ {{ activeCommand()!.name }}</span>
      <span class="text-[11px] text-white/30">—</span>
      <span class="text-[11px] text-white/30">{{ activeCommand()!.description }}</span>
      <button
        (click)="activeCommand.set(null)"
        class="ml-auto text-[11px] text-white/20 hover:text-white/50 border-0 bg-transparent cursor-pointer transition-colors p-0">
        ✕ cancel
      </button>
    </div>
  }

  <!-- Input row -->
  <div class="flex items-end gap-2 bg-white/[0.05] border border-white/[0.08] rounded-2xl px-2 py-1.5 focus-within:border-white/[0.15] transition-colors">

    <p-button icon="pi pi-plus" [text]="true" severity="secondary" size="small" styleClass="shrink-0 self-end mb-0.5" />

    <div
      #editor
      contenteditable="true"
      role="textbox"
      aria-multiline="true"
      [attr.data-placeholder]="placeholder()"
      class="composer-editor flex-1 min-w-0 py-1.5 max-h-[160px] overflow-y-auto outline-none text-sm text-white/80"
      style="scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.06) transparent;"
      (input)="onInput()"
      (keydown)="onKeydown($event)"
      (paste)="onPaste($event)"
      (click)="onEditorClick()"
      (focus)="onEditorFocus()"
    ></div>

    <div class="flex items-center gap-1 self-end mb-0.5 shrink-0">
      <app-gif-picker-button (gifSelected)="onGifSelected($event)" />
      <app-emoji-picker-button (emojiSelected)="onEmojiSelected($event)" />
      <p-button icon="pi pi-send" [text]="true" severity="primary" size="small" (onClick)="send()" />
    </div>

  </div>
</div>
