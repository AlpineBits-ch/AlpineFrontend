<div class="px-4 py-3">
  <div class="flex items-end gap-2 bg-white/[0.05] border border-white/[0.08] rounded-2xl px-2 py-1.5 focus-within:border-white/[0.15] transition-colors">

    <p-button icon="pi pi-plus" [text]="true" severity="secondary" size="small" styleClass="shrink-0 self-end mb-0.5" />

    <textarea
      #composer
      pTextarea
      [autoResize]="true"
      rows="1"
      placeholder="Message"
      (keydown.enter)="$any($event).shiftKey ? null : $event.preventDefault(); $any($event).shiftKey ? null : handleSendMessage(composer)"
      class="flex-1 border-0 bg-transparent outline-none text-sm text-white/80 placeholder:text-white/25 resize-none py-1.5 max-h-[160px] overflow-y-auto focus:shadow-none focus:ring-0"
    ></textarea>

    <div class="flex items-center gap-1 self-end mb-0.5 shrink-0">
      <p-button icon="pi pi-face-smile" [text]="true" severity="secondary" size="small" />
      <p-button icon="pi pi-send" [text]="true" severity="primary" size="small" (onClick)="handleSendMessage(composer)" />
    </div>

  </div>
</div>
