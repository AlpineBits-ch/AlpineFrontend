<div class="flex flex-col h-full bg-app-bg overflow-hidden">

  <!-- Header -->
  <header class="flex items-center px-3 sm:px-5 h-14 border-b border-white/[0.06] shrink-0 bg-app-bg">
    <!-- Back button (mobile only) -->
    <p-button icon="pi pi-arrow-left" [text]="true" severity="secondary" size="small"
      styleClass="lg:hidden shrink-0 mr-1" (onClick)="back.emit()" />

    <div class="flex items-center gap-2 sm:gap-3">
      <div class="relative">
        <p-avatar [label]="chatAvatarLabel()" shape="circle" size="normal"></p-avatar>
        <span class="absolute -bottom-0.5 -right-0.5 block h-3 w-3 rounded-full bg-emerald-400 border-2 border-app-bg"></span>
      </div>
      <div class="flex flex-col">
        <h1 class="text-sm font-semibold text-white/85 m-0 leading-tight">{{ chatTitle() }}</h1>
        <span class="text-[11px] text-emerald-400/70">Online</span>
      </div>
    </div>

    <div class="ml-auto flex items-center gap-0.5 text-white/35">
      <p-button icon="pi pi-phone" [text]="true" severity="secondary" size="small" />
      <p-button icon="pi pi-video" [text]="true" severity="secondary" size="small" />
      <div class="flex items-center gap-2 bg-white/[0.04] border border-white/[0.07] rounded-xl px-3 mx-1 focus-within:border-white/20 transition-colors">
        <i class="pi pi-search text-xs text-white/30 shrink-0"></i>
        <input type="text" placeholder="Search…" class="bg-transparent border-0 outline-none text-xs text-white/75 placeholder-white/25 py-1.5 w-32 min-w-0" />
      </div>
      <p-button icon="pi pi-ellipsis-v" [text]="true" severity="secondary" size="small" />
    </div>
  </header>

  <!-- Messages scroll container -->
  <div
    #messageScroll
    class="flex-1 min-h-0 overflow-y-auto"
    style="scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.08) transparent;"
    (scroll)="onScroll()">

    <div class="flex flex-col justify-end min-h-full px-4">

      <!-- Loading older messages indicator -->
      @if (loadingMore()) {
        <div class="flex items-center justify-center py-3 gap-2 text-white/30 text-xs">
          <i class="pi pi-spinner pi-spin text-xs"></i>
          Loading older messages…
        </div>
      } @else if (!hasMore()) {
        <!-- Conversation start — only show when all history is loaded -->
        <div class="py-8 flex flex-col items-start gap-2">
          <p-avatar [label]="chatAvatarLabel()" shape="circle" styleClass="!w-16 !h-16 !text-2xl"></p-avatar>
          <h2 class="text-2xl font-bold text-white/90 mt-3">{{ chatTitle() }}</h2>
          <p class="text-sm text-white/40 max-w-md leading-relaxed">
            This is the beginning of your direct message history with <span class="text-white/65">{{ chatTitle() }}</span>.
          </p>
          <hr class="w-full border-t border-white/[0.06] mt-4" />
        </div>
      }

      <!-- Messages list -->
      <div class="flex flex-col gap-0.5 pb-4">
        @for (msg of messages(); track msg.id) {
          <app-message [message]="msg"></app-message>
        }
      </div>

    </div>
  </div>

  <!-- Composer -->
  <footer class="shrink-0">
    <app-composer class="block" [friends]="friends()" (message)="createMessage($event)"></app-composer>
  </footer>

</div>
