<div class="flex items-start gap-3 p-4">
    <p-avatar
            [label]="message().authorId[0].toUpperCase()"
            shape="circle"
            styleClass="bg-primary text-primary-contrast shadow-sm">
    </p-avatar>

    <div class="flex flex-col w-full max-w-[70%]">
        <div class="flex items-center gap-2 mb-1">
      <span class="text-sm font-bold text-surface-900 dark:text-surface-0">
        User: {{ message().authorId }}
      </span>
            <span class="text-xs text-surface-500">
        {{ message().createdAt | date: 'shortTime' }}
      </span>
        </div>

        <div class="p-3 rounded-2xl bg-surface-100 dark:bg-surface-800 border border-surface-200 dark:border-surface-700">
            <p class="text-sm leading-relaxed text-surface-700 dark:text-surface-100 m-0">
                {{ message().content }}
            </p>
        </div>

        @if (message().updatedAt > message().createdAt) {
            <span class="text-[10px] italic text-surface-400 mt-1">
        Edited
      </span>
        }
    </div>
</div>
