<div class="flex items-start gap-3 px-4 py-1.5 hover:bg-white/[0.02] rounded-lg transition-colors group">

  <p-avatar [label]="message().authorId[0].toUpperCase()" shape="circle" styleClass="shrink-0 mt-0.5"></p-avatar>

  <div class="flex flex-col min-w-0 flex-1">
    <div class="flex items-baseline gap-2 mb-1">
      <span class="text-sm font-semibold text-white/85">{{ message().authorId }}</span>
      <span class="text-[11px] text-white/25">{{ message().createdAt | date: 'shortTime' }}</span>
    </div>
    <p class="text-sm leading-relaxed text-white/70 m-0 break-words">{{ content() }}</p>
    @if (message().updatedAt > message().createdAt) {
      <span class="text-[10px] italic text-white/25 mt-0.5">Edited</span>
    }
  </div>

</div>
