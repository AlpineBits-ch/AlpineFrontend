<div class="flex flex-col w-60 h-full bg-sidebar border-r border-white/[0.06]">

  <div class="flex-1 min-h-0 flex flex-col">
    @let workspace = navService.workspace();
    @switch (workspace.type) {
      @case ('dms') {
        <app-dm-sidepanel />
      }
      @case ('server') {
        <app-channel-list [guild]="workspace.guild" />
      }
    }
  </div>

</div>
