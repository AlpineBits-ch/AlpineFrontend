<!-- 272px rather than the 240px (`w-60`) this was. Both the DM list and the channel list render in
     here, so this is the single place that decides the width of either, and it is what the profile
     footer below derives its own width from. -->
<div class="flex flex-col w-[272px] h-full bg-sidebar border-r border-white/[0.10]"
     style="padding-top: env(safe-area-inset-top)">

    <div class="flex-1 min-h-0 flex flex-col">
        @let workspace = navService.workspace();
        @switch (workspace.type) {
            @case ('dms') {
                <app-dm-sidepanel/>
            }
            @case ('server') {
                <app-channel-list [guild]="workspace.guild" class="flex flex-col flex-1 min-h-0"/>
            }
        }
    </div>

</div>
