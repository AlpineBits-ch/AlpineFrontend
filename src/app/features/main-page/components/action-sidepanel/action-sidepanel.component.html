<div class="flex flex-col w-56 h-full bg-sidebar border-r border-white/[0.06]">

  <!-- Workspace-specific panel fills remaining space -->
  <div class="flex-1 min-h-0 flex flex-col">
    @let workspace = navService.workspace();
    @switch (workspace.type) {
      @case ('dms') {
        <app-dm-sidepanel />
      }
      @case ('server') {
        <app-channel-list [guild]="workspace.guild" />
      }
    }
  </div>

  <!-- Quick settings pinned to bottom -->
  <app-quick-settings />

</div>
