<div class="flex items-center h-12 px-3 bg-app-bg border-b border-white/[0.06] gap-2 shrink-0">

  <!-- Hamburger (mobile only) -->
  <p-button icon="pi pi-bars" [text]="true" severity="secondary" size="small"
    styleClass="lg:hidden shrink-0" (onClick)="menuToggle.emit()" />

  <!-- Logo — clicking returns to DM workspace -->
  <button (click)="navService.selectDMs()"
    class="w-8 h-8 rounded-xl bg-gradient-to-br from-indigo-500 to-indigo-700 flex items-center justify-center text-white font-black text-base shrink-0 cursor-pointer border-0">
    A
  </button>

  <!-- Divider -->
  <div class="w-px h-5 bg-white/10 shrink-0 mx-1"></div>

  <!-- Scrollable server tabs -->
  <div class="flex-1 flex items-center gap-1 overflow-x-auto" style="scrollbar-width: none;">
    @for (server of serverIcons(); track server.id) {
      <app-server-icon
        [serverData]="server"
        (click)="navService.selectServer(guilds[$index])">
      </app-server-icon>
    }
    <!-- Keep as custom: dashed border style not supported by p-button -->
    <button class="shrink-0 w-8 h-8 rounded-xl border border-dashed border-white/20 text-white/30 hover:text-white/60 hover:border-white/40 flex items-center justify-center transition-all text-lg leading-none cursor-pointer bg-transparent">+</button>
  </div>

  <!-- Search + notifications -->
  <div class="flex items-center gap-2 shrink-0">
    <div class="hidden sm:flex items-center gap-2 bg-white/[0.04] border border-white/[0.07] rounded-xl px-3 w-44 focus-within:border-white/20 transition-colors">
      <i class="pi pi-search text-xs text-white/30 shrink-0"></i>
      <input
        type="text"
        placeholder="Search…"
        class="flex-1 bg-transparent border-0 outline-none text-xs text-white/80 placeholder-white/25 py-1.5 min-w-0" />
      <kbd class="text-[10px] text-white/20 bg-white/5 px-1.5 py-0.5 rounded shrink-0">⌘K</kbd>
    </div>
    <p-button icon="pi pi-bell" [text]="true" severity="secondary" />
  </div>

</div>
