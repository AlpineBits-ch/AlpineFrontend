<div class="flex flex-col w-[68px] h-full bg-app-bg border-r border-white/[0.06] items-center py-3 gap-2 shrink-0">

  <!-- Home / DMs button -->
  <button (click)="navService.selectDMs()"
    class="w-11 h-11 flex items-center justify-center font-black text-base transition-all cursor-pointer border-0 shrink-0"
    [ngClass]="isDMsActive()
      ? 'rounded-2xl bg-indigo-500/20 text-indigo-400'
      : 'rounded-full bg-white/[0.07] text-white/60 hover:rounded-2xl hover:bg-indigo-500/20 hover:text-indigo-400'">
    A
  </button>

  <!-- Separator -->
  <div class="w-8 h-px bg-white/10 shrink-0"></div>

  <!-- Scrollable server icons -->
  <div class="flex-1 min-h-0 overflow-y-auto w-full flex flex-col items-center gap-2 py-1"
       style="scrollbar-width: none;">
    @for (server of serverIcons(); track server.id) {
      <app-server-icon
        [serverData]="server"
        (click)="navService.selectServer(guilds()[$index])">
      </app-server-icon>
    }
  </div>

  <!-- Add server button -->
  <button
    (click)="showCreateModal.set(true)"
    class="w-11 h-11 rounded-full hover:rounded-2xl border border-dashed border-white/20 text-white/30 hover:text-indigo-400 hover:border-indigo-400 hover:bg-indigo-500/10 flex items-center justify-center transition-all text-xl leading-none cursor-pointer bg-transparent shrink-0">
    +
  </button>

</div>

<app-create-guild-modal
  [(visible)]="showCreateModal"
  (guildCreated)="onGuildCreated($event)" />
