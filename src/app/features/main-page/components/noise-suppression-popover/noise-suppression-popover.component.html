<button
    (click)="toggle()"
    [attr.aria-expanded]="open()"
    [attr.aria-label]="'VOICE_BAR.NOISE_SUPPRESSION' | translate"
    [attr.title]="'VOICE_BAR.NOISE_SUPPRESSION' | translate"
    [class]="triggerClass()"
    class="call-focusable flex size-7 shrink-0 cursor-pointer items-center justify-center rounded-lg border-0 transition-colors"
    type="button"
>
    <i class="pi pi-sparkles text-xs"></i>
</button>

@if (open()) {
    <div
        class="absolute bottom-full right-0 z-50 mb-2 flex w-64 flex-col gap-3 rounded-xl border border-border-subtle bg-card p-3 shadow-xl"
    >
        <p class="text-xs font-semibold uppercase tracking-wide text-text-muted">
            {{ 'VOICE_BAR.NOISE_SUPPRESSION' | translate }}
        </p>

        <div class="flex gap-0.5 rounded-lg bg-white/[0.06] p-0.5">
            @for (m of modes; track m.value) {
                <button
                    (click)="select(m.value)"
                    [attr.aria-pressed]="mode() === m.value"
                    [class]="segmentClass(m.value)"
                    class="call-focusable flex-1 cursor-pointer rounded-md border-0 px-2 py-1 text-[0.6875rem] font-medium transition-colors"
                    type="button"
                >
                    {{ m.labelKey | translate }}
                </button>
            }
        </div>

        <!-- Fixed height: the three hints wrap to different line counts, and a panel that resizes
             under the cursor moves the buttons the user is aiming at. -->
        <p class="min-h-[2.25rem] text-[0.6875rem] leading-snug text-text-muted">
            {{ hintKey() | translate }}
        </p>

        <div class="flex flex-col gap-1.5 border-t border-border-subtle pt-2.5">
            <span class="text-[0.6875rem] text-text-muted">{{ 'VOICE_BAR.NS_YOUR_MIC' | translate }}</span>
            <span class="flex h-3 items-stretch gap-[2px]">
                @for (bar of bars; track $index) {
                    <span
                        [class]="barActive($index) ? barClass($index) : 'bg-white/[0.08]'"
                        class="flex-1 rounded-[1px] transition-colors duration-[60ms]"
                    ></span>
                }
            </span>
        </div>
    </div>
}
