<div class="flex flex-col gap-0.5">
  @for (conv of conversations(); track conv.id) {
    <button
      (click)="selectedId.set(conv.id); conversationSelected.emit(conv)"
      class="w-full flex items-center gap-2.5 px-2 py-2 rounded-xl transition-all cursor-pointer border-0 text-left"
      [class.bg-white/[0.08]]="selectedId() === conv.id"
      [class.hover:bg-white/[0.05]]="selectedId() !== conv.id"
      [class.bg-transparent]="selectedId() !== conv.id">
      <div class="relative shrink-0">
        <p-avatar icon="pi pi-user" shape="circle" size="normal"></p-avatar>
        <div class="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 rounded-full bg-emerald-400 border-2 border-[#111520]"></div>
      </div>
      <div class="flex-1 min-w-0">
        <div class="flex items-center justify-between gap-1">
          <span class="text-sm font-medium truncate"
            [class.text-white/90]="selectedId() === conv.id"
            [class.text-white/65]="selectedId() !== conv.id">
            {{ getChatName(conv) }}
          </span>
          <span class="text-[10px] text-white/25 shrink-0">2m</span>
        </div>
        <span class="text-[11px] text-white/30 truncate block">Start a conversation…</span>
      </div>
    </button>
  }
</div>
