<div class="w-full flex h-full flex-col gap-0 overflow-hidden">

    <div class="w-full bg-gray-800 min-h-[5rem]">
        <h1 class="text-xl text-center p-3">Conversations & Friends</h1>
        <div class="w-full flex justify-center p-1">
            <input pInputText type="text" placeholder="Search" class="w-full" />
        </div>

    </div>

    <div class="flex-1 min-h-0 w-full">

        @for (conv of conversations(); track conv.id) {
            <div class="w-full h-12 bg-gray-800 flex-row items-center gap-2 flex">
                <p-avatar icon="pi pi-user" shape="circle" class="bg-blue-100 text-blue-700"></p-avatar>
                <p class="text-center text-lg">{{ getChatName(conv) }}</p>
            </div>
        }
    </div>
</div>
