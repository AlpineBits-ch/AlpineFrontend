<!-- Rendered inside the self menu's accounts view, which supplies its own back header - so no
     section title here, and no dividers between this and what came before it. -->
<div class="mx-3 mb-3 bg-card rounded-xl overflow-hidden">
    @for (slot of others(); track slot.id) {
        <button
            (click)="choose(slot)"
            [disabled]="busy()"
            class="flex w-full items-center gap-3 px-3 py-2 text-left transition-colors duration-[120ms] ease-out hover:bg-hover disabled:opacity-50 border-0 bg-transparent cursor-pointer"
            type="button"
        >
            @if (slot.avatarUrl) {
                <img [src]="slot.avatarUrl" alt="" class="size-7 shrink-0 rounded-full object-cover" />
            } @else {
                <span
                    class="flex size-7 shrink-0 items-center justify-center rounded-full bg-brand-dark text-[0.6875rem] text-text-primary"
                >
                    {{ initial(slot) }}
                </span>
            }
            <span class="min-w-0 flex-1">
                <span class="block truncate text-[0.8125rem] text-text-primary">
                    {{ slot.displayName || slot.username }}
                </span>
                <!-- The host, so two accounts sharing a username on two servers stay apart. -->
                <span class="block truncate text-[0.6875rem] text-text-muted">
                    {{ serverLabel(slot) }}
                </span>
            </span>
        </button>
    }

    @if (others().length > 0) {
        <div class="mx-3 h-px bg-border-subtle"></div>
    }

    <button
        (click)="onAdd()"
        type="button"
        class="flex w-full items-center gap-3 px-3 h-10 text-left transition-colors duration-[120ms] ease-out hover:bg-hover border-0 bg-transparent cursor-pointer"
    >
        <i class="pi pi-plus shrink-0 text-text-secondary" style="font-size: 1rem"></i>
        <span class="flex-1 text-[0.875rem] text-text-primary">{{ 'ACCOUNTS.ADD' | translate }}</span>
    </button>
</div>
