<div class="w-60 h-full border-l border-white/[0.06] bg-sidebar flex flex-col overflow-y-auto"
     style="scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.06) transparent;">

  @if (isDirect()) {
    @let partner = others()[0];

    <!-- Profile card (1-on-1) -->
    <div class="flex flex-col items-center px-5 pt-8 pb-5 border-b border-white/[0.06]">
      <div class="relative mb-3">
        <p-avatar [label]="partner.cachedUserName[0].toUpperCase()" shape="circle"
          styleClass="!w-16 !h-16 !text-2xl" />
        <span class="absolute -bottom-0.5 -right-0.5 block h-3.5 w-3.5 rounded-full bg-emerald-400 border-2 border-sidebar"></span>
      </div>
      <h2 class="text-sm font-semibold text-white/90 m-0">{{ partner.cachedUserName }}</h2>
      <span class="text-xs text-white/40">#{{ partner.cachedUserHash }}</span>
      <span class="mt-1.5 text-[11px] text-emerald-400/80 flex items-center gap-1">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 inline-block"></span>
        Online
      </span>
    </div>

    <!-- Quick actions -->
    <div class="px-4 py-4 border-b border-white/[0.06]">
      <p class="text-[10px] font-semibold uppercase tracking-widest text-white/25 mb-2 px-1">Actions</p>
      <div class="flex flex-col gap-0.5">
        <button class="flex items-center gap-2.5 px-2 py-2 rounded-lg text-left text-sm text-white/55 hover:text-white/80 hover:bg-white/[0.05] bg-transparent border-0 cursor-pointer transition-colors w-full">
          <i class="pi pi-phone text-xs w-4 text-center"></i> Voice call
        </button>
        <button class="flex items-center gap-2.5 px-2 py-2 rounded-lg text-left text-sm text-white/55 hover:text-white/80 hover:bg-white/[0.05] bg-transparent border-0 cursor-pointer transition-colors w-full">
          <i class="pi pi-video text-xs w-4 text-center"></i> Video call
        </button>
      </div>
    </div>

  } @else {

    <!-- Members list (group chat) -->
    <div class="px-4 py-4">
      <p class="text-[10px] font-semibold uppercase tracking-widest text-white/25 mb-2 px-1">
        Members — {{ others().length }}
      </p>
      <div class="flex flex-col gap-0.5">
        @for (member of others(); track member.id) {
          <div class="flex items-center gap-2.5 px-2 py-1.5 rounded-lg hover:bg-white/[0.04] transition-colors">
            <div class="relative shrink-0">
              <p-avatar [label]="member.cachedUserName[0].toUpperCase()" shape="circle" size="normal" />
              <span class="absolute -bottom-0.5 -right-0.5 block h-2.5 w-2.5 rounded-full bg-emerald-400 border-2 border-sidebar"></span>
            </div>
            <div class="flex flex-col min-w-0">
              <span class="text-sm text-white/75 truncate leading-tight">{{ member.cachedUserName }}</span>
              <span class="text-[11px] text-white/30">#{{ member.cachedUserHash }}</span>
            </div>
          </div>
        }
      </div>
    </div>

  }

</div>
