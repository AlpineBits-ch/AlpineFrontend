<app-settings-modal [(isVisible)]="isSettingsOpen"></app-settings-modal>
<app-admin-modal [(isVisible)]="isAdminOpen"></app-admin-modal>

<!-- `w-0 min-w-full` is load-bearing, not a trick for its own sake. This footer is a child of a
     `flex flex-col` whose width is intrinsic - it comes from the two columns above it, the 68px
     server rail plus the 240px side panel. A normally-sized footer contributes its own max-content
     width to that calculation, and this row's contents (avatar, name, and up to four buttons) are
     wider than 308px, so the left panel was being stretched by its own footer and overhung the
     sidebar it is supposed to sit under. `w-0` takes this element out of that calculation;
     `min-w-full` then stretches it back to whatever the columns above settled on. -->
<!-- No top border and no background of its own: the panel behind is the same colour as the channel
     list, so the footer is just the bottom of that list with a card resting on it. A rule here
     would draw a second boundary a few pixels above the card's own edge. -->
<div class="shrink-0 w-0 min-w-full bg-sidebar overflow-hidden p-2">

    <!-- One container holding both rows, not a card above a bare strip.
         The activity row and the user row are two parts of the same object - the second is where
         you are, the first is what you are doing - and giving only one of them a raised surface
         left the other looking like the panel had run out. Inside a rounded container a divider
         reads as a menu separator; the same rule full-bleed across the panel read as a table. -->
    <div class="rounded-xl bg-card overflow-hidden">

        <app-self-activity-card/>

        <!-- Slightly taller than the activity row above it. It carries two lines of text against a
             32px avatar, which fits in 33px and looked wedged in at the tighter padding. -->
        <div class="flex items-center gap-1 px-2 py-2.5 min-w-0">

            <!-- Avatar + name (clickable -opens self-profile popover).
                 `-mx-1 px-1` keeps the avatar aligned with the artwork tile above while letting the
                 hover pill bleed a little wider than its contents. -->
            @if (profileService.ownProfile(); as own) {
                <button (click)="openSelfProfilePopover($event)"
                        class="flex items-center gap-1.5 flex-1 min-w-0 rounded-lg px-1 py-1 -mx-1 hover:bg-white/[0.06] transition-colors duration-[120ms] ease-out cursor-pointer border-0 text-left">

                    <!-- Avatar + status dot.
                         The dot answers "what have I told people I am", which is not the same
                         question as "is my websocket up" - it used to answer the second one, which
                         left a user who had set themselves Invisible looking green to themselves.

                         `border-card`, not `border-sidebar`: the row moved onto the card surface,
                         and the dot's ring and the notch in its silhouette are both drawn in
                         whatever colour it is told sits behind it. -->
                    <div class="relative shrink-0 mr-1">
                        <app-avatar [userId]="own.userId"/>
                        <app-user-status-dot [status]="own.onlineStatus"
                                             borderColor="border-card"
                                             size="md"/>
                    </div>

                    <!-- Name, then either the status or - when the socket is in trouble - the
                         socket. Trouble outranks the status because it is the more urgent thing to
                         say, and the dot is still carrying presence while it is being said. -->
                    <div class="flex-1 min-w-0">
                        <p class="text-[0.875rem] font-medium text-text-primary truncate leading-tight">{{ own.userName }}</p>
                        @if (showConnectionTrouble()) {
                            <app-connection-status></app-connection-status>
                        } @else if (statusLabelKey(); as key) {
                            <p class="text-[0.75rem] text-text-muted truncate leading-tight mt-0.5">{{ key | translate }}</p>
                        }
                    </div>

                </button>
            } @else {
                <!-- Nothing is known yet. A skeleton says so; an empty row implies the panel is
                     broken, and a default name implies something false about who is signed in. -->
                <div class="flex items-center gap-1.5 flex-1 min-w-0 px-1 py-1 -mx-1">
                    <div class="w-8 h-8 shrink-0 mr-1 rounded-full bg-white/[0.06] animate-pulse"></div>
                    <div class="flex-1 min-w-0">
                        <div class="h-3 w-24 rounded-md bg-white/[0.08] animate-pulse"></div>
                        <div class="h-2.5 w-16 rounded-md bg-white/[0.05] animate-pulse mt-1.5"></div>
                    </div>
                </div>
            }
            <app-self-profile-popover (addAccount)="startAddAccount()" (editProfile)="openProfileSettings()"
                                      (openAdmin)="isAdminOpen.set(true)"/>

            <!-- Always present, in a call or not. Mute is a statement about this machine's
                 microphone, so hiding the control outside a call both changed the row's shape on
                 join and left no way to arrive in a channel already muted. -->
            <app-voice-toggle
                    [active]="voiceControls.isMuted()"
                    icon="pi-microphone"
                    [label]="voiceControls.isMuted() ? 'QUICK_SETTINGS.UNMUTE' : 'QUICK_SETTINGS.MUTE'"
                    deviceLabel="QUICK_SETTINGS.INPUT_DEVICE"
                    [devices]="catalog.mics()" [selected]="audio.settings().micId"
                    (toggled)="voiceControls.toggleMute()"
                    (deviceChosen)="audio.update({micId: $event})"
                    [namesWithheld]="catalog.namesWithheld()"
                    (openSettings)="openVoiceSettings()"/>

            <app-voice-toggle
                    [active]="voiceControls.isDeafened()"
                    icon="pi-headphones"
                    [label]="voiceControls.isDeafened() ? 'QUICK_SETTINGS.UNDEAFEN' : 'QUICK_SETTINGS.DEAFEN'"
                    deviceLabel="QUICK_SETTINGS.OUTPUT_DEVICE"
                    [devices]="catalog.speakers()" [selected]="audio.settings().speakerId"
                    (toggled)="voiceControls.toggleDeafen()"
                    (deviceChosen)="audio.update({speakerId: $event})"
                    [namesWithheld]="catalog.namesWithheld()"
                    (openSettings)="openVoiceSettings()"/>

            <!-- Three controls, not five. Status moved into the profile menu, where it can carry
                 its own name instead of being a bare dot, and the admin shield went with it - both
                 were squeezing this row at a 240px panel width. -->
            <p-button (onClick)="isSettingsOpen.set(true)" [text]="true" data-testid="user-menu" icon="pi pi-cog"
                      severity="secondary"
                      size="small" styleClass="shrink-0"/>

        </div>
    </div>
</div>
