<app-friendship-modal [(isVisible)]="isFriendshipModalVisible"></app-friendship-modal>

<div class="w-full bg-blue-200 min-h-[3rem] flex flex-row items-center p-2 gap-3 justify-between rounded-md shadow-xl">

    <div class="flex flex-row items-center gap-3">
        <p-avatar icon="pi pi-user" shape="circle" styleClass="bg-blue-100 text-blue-700"></p-avatar>
        <div class="flex flex-col">
            <p>{{profileService.profile()?.userName}}#{{profileService.profile()?.hash}}</p>
            <p class="text-xs">Invisible</p>
        </div>

    </div>

    <div class="justify-self-end flex flex-row gap-2 items-center">
        <app-connection-status></app-connection-status>
        <p-button icon="pi pi-cog" severity="secondary" [rounded]="true" [text]="true" (click)="isFriendshipModalVisible.set(true)"></p-button>
    </div>
</div>
