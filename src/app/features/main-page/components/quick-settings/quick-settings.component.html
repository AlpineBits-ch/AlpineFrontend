<app-settings-modal [(isVisible)]="isSettingsOpen"></app-settings-modal>

<div class="shrink-0 border-t border-white/[0.06] p-3">
  <div class="flex items-center gap-2.5">
    <div class="relative shrink-0">
      <p-avatar icon="pi pi-user" shape="circle"></p-avatar>
      <div class="absolute -bottom-0.5 -right-0.5 w-3 h-3 rounded-full bg-slate-500 border-2 border-[#111520]"></div>
    </div>
    <div class="flex-1 min-w-0">
      <p class="text-sm font-medium text-white/85 truncate leading-tight">{{ profileService.profile()?.userName }}</p>
      <p class="text-[11px] text-white/30 leading-tight">#{{ profileService.profile()?.hash }}</p>
    </div>
    <button
      (click)="isSettingsOpen.set(true)"
      class="w-7 h-7 rounded-lg flex items-center justify-center text-white/30 hover:text-white/65 hover:bg-white/[0.06] transition-all cursor-pointer border-0 bg-transparent shrink-0">
      <i class="pi pi-cog text-sm"></i>
    </button>
  </div>
</div>
