<app-settings-modal [(isVisible)]="isSettingsOpen"></app-settings-modal>
<app-admin-modal [(isVisible)]="isAdminOpen"></app-admin-modal>

<!-- `w-0 min-w-full` is load-bearing, not a trick for its own sake. This footer is a child of a
     `flex flex-col` whose width is intrinsic - it comes from the two columns above it, the 68px
     server rail plus the 240px side panel. A normally-sized footer contributes its own max-content
     width to that calculation, and this row's contents (avatar, name, and up to four buttons) are
     wider than 308px, so the left panel was being stretched by its own footer and overhung the
     sidebar it is supposed to sit under. `w-0` takes this element out of that calculation;
     `min-w-full` then stretches it back to whatever the columns above settled on. -->
<div class="shrink-0 w-0 min-w-full bg-sidebar border-t border-border-subtle overflow-hidden">

    <app-self-activity-card/>

    <div class="flex items-center gap-1 px-2 py-2 min-w-0">

        <!-- Avatar + name (clickable -opens self-profile popover) -->
        @if (profileService.ownProfile(); as own) {
            <button (click)="openSelfProfilePopover($event)"
                    class="flex items-center gap-1.5 flex-1 min-w-0 rounded-lg p-1 -m-1 hover:bg-white/[0.06] transition-colors duration-[120ms] ease-out cursor-pointer border-0 text-left">

                <!-- Avatar + status dot.
                     The dot answers "what have I told people I am", which is not the same question
                     as "is my websocket up" - it used to answer the second one, which left a user
                     who had set themselves Invisible looking green to themselves. -->
                <div class="relative shrink-0 mr-1">
                    <app-avatar [userId]="own.userId"/>
                    <app-user-status-dot [status]="own.onlineStatus"
                                         borderColor="border-sidebar"
                                         size="md"/>
                </div>

                <!-- Name, then either the status or - when the socket is in trouble - the socket.
                     Trouble outranks the status because it is the more urgent thing to say, and the
                     dot is still carrying presence on its own while it is being said. -->
                <div class="flex-1 min-w-0">
                    <p class="text-[0.875rem] font-medium text-text-primary truncate leading-tight">{{ own.userName }}</p>
                    @if (showConnectionTrouble()) {
                        <app-connection-status></app-connection-status>
                    } @else if (statusLabelKey(); as key) {
                        <p class="text-[0.75rem] text-text-muted truncate leading-tight mt-0.5">{{ key | translate }}</p>
                    }
                </div>

            </button>
        } @else {
            <!-- Nothing is known yet. A skeleton says so; an empty row implies the panel is broken
                 and a default name implies something false about who is signed in. -->
            <div class="flex items-center gap-1.5 flex-1 min-w-0 p-1 -m-1">
                <div class="w-8 h-8 shrink-0 mr-1 rounded-full bg-white/[0.06] animate-pulse"></div>
                <div class="flex-1 min-w-0">
                    <div class="h-3 w-24 rounded-md bg-white/[0.08] animate-pulse"></div>
                    <div class="h-2.5 w-16 rounded-md bg-white/[0.05] animate-pulse mt-1.5"></div>
                </div>
            </div>
        }
        <app-self-profile-popover (addAccount)="startAddAccount()" (editProfile)="openProfileSettings()"/>

        <!-- Mute (only when in voice) -->
        @if (voiceSvc.isInVoice()) {
            <button
                    (click)="voiceSvc.toggleMute()"
                    [ngClass]="voiceSvc.localState().isMuted
          ? 'bg-rose-500/15 text-rose-400 hover:bg-rose-500/25'
          : 'text-text-secondary hover:bg-white/[0.06] hover:text-text-primary'"
                    [title]="(voiceSvc.localState().isMuted ? 'QUICK_SETTINGS.UNMUTE' : 'QUICK_SETTINGS.MUTE') | translate"
                    class="w-8 h-8 flex items-center justify-center rounded-lg transition-colors duration-[120ms] ease-out cursor-pointer border-0 shrink-0">
                <i [ngClass]="voiceSvc.localState().isMuted ? 'pi-microphone-slash' : 'pi-microphone'"
                   class="pi" style="font-size: 1.125rem"></i>
            </button>

            <!-- Deafen (only when in voice) -->
            <button
                    (click)="voiceSvc.toggleDeafen()"
                    [ngClass]="voiceSvc.localState().isDeafened
          ? 'bg-rose-500/15 text-rose-400 hover:bg-rose-500/25'
          : 'text-text-secondary hover:bg-white/[0.06] hover:text-text-primary'"
                    [title]="(voiceSvc.localState().isDeafened ? 'QUICK_SETTINGS.UNDEAFEN' : 'QUICK_SETTINGS.DEAFEN') | translate"
                    class="w-8 h-8 flex items-center justify-center rounded-lg transition-colors duration-[120ms] ease-out cursor-pointer border-0 shrink-0">
                <i class="pi pi-volume-off" style="font-size: 1.125rem"></i>
            </button>
        }

        <!-- Admin (only for Admin users) -->
        @if (userService.self()?.userType === UserType.Admin) {
            <p-button (onClick)="isAdminOpen.set(true)" [text]="true" icon="pi pi-shield" severity="secondary"
                      size="small" styleClass="shrink-0" title="Admin Panel"/>
        }

        <!-- Self status picker -->
        <app-status-picker/>

        <!-- Settings -->
        <p-button (onClick)="isSettingsOpen.set(true)" [text]="true" icon="pi pi-cog" severity="secondary" size="small"
                  styleClass="shrink-0"/>

    </div>
</div>
