<app-settings-modal [(isVisible)]="isSettingsOpen"></app-settings-modal>

<div class="shrink-0 bg-sidebar border-t border-white/[0.06] p-3">
  <div class="flex items-center gap-2.5">
    <div class="relative shrink-0">
      <app-avatar [userId]="profileService.ownProfile()?.userId" />
      <div class="absolute -bottom-0.5 -right-0.5 w-3 h-3 rounded-full border-2 border-sidebar"
        [class.bg-emerald-400]="websocketService.connectionState() === ConnectionState.Connected"
        [class.bg-amber-400]="websocketService.connectionState() === ConnectionState.Connecting"
        [class.bg-rose-500]="websocketService.connectionState() === ConnectionState.Disconnected"></div>
    </div>
    <div class="flex-1 min-w-0">
      <p class="text-sm font-medium text-white/85 truncate leading-tight">{{ profileService.ownProfile()?.userName }}</p>
      <app-connection-status></app-connection-status>
    </div>
    <p-button icon="pi pi-cog" [text]="true" severity="secondary" size="small" styleClass="shrink-0" (onClick)="isSettingsOpen.set(true)" />
  </div>
</div>
