@let state = websocketService.connectionState();

<div class="flex items-center gap-1.5">
  <!-- Status dot -->
  <div class="w-1.5 h-1.5 rounded-full shrink-0"
    [class.bg-emerald-400]="state === ConnectionState.Connected"
    [class.bg-amber-400]="state === ConnectionState.Connecting"
    [class.animate-pulse]="state === ConnectionState.Connecting"
    [class.bg-rose-500]="state === ConnectionState.Disconnected">
  </div>

  <!-- Status text -->
  <span class="text-[11px] font-medium leading-none"
    [ngClass]="{
      'text-emerald-400/85': state === ConnectionState.Connected,
      'text-amber-400/90':   state === ConnectionState.Connecting,
      'text-rose-400/90':    state === ConnectionState.Disconnected
    }">
    @switch (state) {
      @case (ConnectionState.Connected)    { Connected }
      @case (ConnectionState.Connecting)   { Connecting… }
      @case (ConnectionState.Disconnected) { Disconnected }
    }
  </span>
</div>
