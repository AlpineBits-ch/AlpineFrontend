@if (voiceSvc.isInVoice()) {
    @let status = callStatus();

    <div class="shrink-0 select-none border-t border-border-subtle bg-sidebar px-3 py-2">

        <div class="flex items-center gap-2">

            <!-- Status dot. Colour and pulse come from the same resolver the in-call status row
                 uses, so the sidebar cannot disagree with the call about how it is going. -->
            <span [class]="dotClass()"></span>

            <!-- Channel info (clickable) -->
            <button
                    (click)="navigateToChannel()"
                    class="call-focusable min-w-0 flex-1 cursor-pointer border-0 bg-transparent p-0 text-left"
                    type="button">
                <p [class]="'text-xs font-semibold leading-tight ' + labelClass()">
                    {{ status.labelKey | translate }}
                </p>
                <p class="mt-0.5 truncate text-[0.6875rem] leading-tight text-white/55">
                    {{ voiceSvc.joinedChannelName() }}
                    @if (voiceSvc.joinedGuildName()) {
                        <span class="text-white/35"> · {{ voiceSvc.joinedGuildName() }}</span>
                    }
                </p>
            </button>

            <!-- Disconnect -->
            <button
                    (click)="voiceSvc.leaveChannel()"
                    [attr.aria-label]="'VOICE_BAR.DISCONNECT' | translate"
                    [attr.title]="'VOICE_BAR.DISCONNECT' | translate"
                    class="call-focusable flex size-7 shrink-0 cursor-pointer items-center justify-center rounded-lg
                           border-0 bg-offline/15 text-offline transition-colors hover:bg-offline/25"
                    type="button">
                <i class="pi pi-phone rotate-[135deg] text-xs"></i>
            </button>

        </div>
    </div>
}
