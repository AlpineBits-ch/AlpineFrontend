@if (cardState() === 'loading') {
    <div class="flex items-start gap-3 bg-card border border-border-default rounded-xl px-4 py-3 mt-1 max-w-md w-full">
        <div class="w-9 h-9 rounded-lg bg-white/[0.06] animate-pulse shrink-0"></div>
        <div class="flex flex-col gap-1.5 flex-1 pt-0.5">
            <div class="w-40 h-3 rounded bg-white/[0.06] animate-pulse"></div>
            <div class="w-full h-2.5 rounded bg-white/[0.04] animate-pulse"></div>
        </div>
    </div>
} @else if (cardState() === 'error') {
    <div class="inline-flex items-center gap-2 bg-card border border-border-default rounded-xl px-4 py-3 mt-1
                text-xs text-white/35">
        <i class="pi pi-exclamation-circle text-rose-400/60 text-sm"></i>
        {{ 'WIKI.CARD.UNAVAILABLE' | translate }}
    </div>
} @else if (preview(); as loaded) {
    <!--
      A button rather than a div: this navigates, and a keyboard has to be able to reach it. Left
      inert - and looking it - where the guild is one we are not in, or its Wiki module is off.
    -->
    <button (click)="open()"
            [disabled]="!reachable()"
            [ngClass]="reachable()
                ? 'cursor-pointer hover:bg-hover hover:border-[color-mix(in_srgb,var(--color-brand-dim)_40%,transparent)]'
                : 'cursor-default'"
            class="flex items-start gap-3 bg-card border border-border-default rounded-xl px-4 py-3 mt-1
                   max-w-md w-full text-left transition-colors group/wiki"
            type="button">

        <div class="shrink-0 w-9 h-9 rounded-lg bg-brand/15 flex items-center justify-center">
            <i class="pi pi-book text-brand-dim text-sm"></i>
        </div>

        <div class="flex-1 min-w-0">
            <!-- Where it lives, above the title: the same order the wiki's own breadcrumbs use. -->
            @if (trail().length) {
                <p class="text-[0.625rem] uppercase tracking-widest text-white/30 m-0 truncate">
                    @for (name of trail(); track $index) {
                        @if (!$first) {
                            <span class="text-white/15"> / </span>
                        }{{ name }}
                    }
                </p>
            }

            <p class="text-sm font-semibold text-white/85 m-0 leading-snug truncate">
                {{ loaded.page.title }}
            </p>

            @if (snippet()) {
                <p class="text-xs text-white/40 m-0 mt-1 leading-relaxed line-clamp-2">{{ snippet() }}</p>
            }

            <p class="text-[0.6875rem] text-white/30 m-0 mt-1.5 truncate">
                @if (editorName()) {
                    {{ 'WIKI.CARD.EDITED_BY' | translate: {name: editorName()} }}
                    <span class="text-white/15"> · </span>
                }
                {{ loaded.page.updatedAt | date: 'mediumDate' }}
                @if (!reachable()) {
                    <span class="text-white/15"> · </span>{{ 'WIKI.CARD.NOT_A_MEMBER' | translate }}
                }
            </p>
        </div>

        @if (reachable()) {
            <i class="pi pi-angle-right text-white/20 text-sm shrink-0 self-center transition-colors"></i>
        }
    </button>
}
