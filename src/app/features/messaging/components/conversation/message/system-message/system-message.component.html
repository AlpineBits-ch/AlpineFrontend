@let text = variantKey() | translate: translateParams();
@let parts = text.split(userToken);
<div class="flex justify-center px-4 py-1">
    <span class="text-xs text-text-muted text-center">
        <!-- Copy without the token still renders, as plain text. -->
        @if (parts.length > 1) {
            {{ parts[0]
            }}<span
                (click)="openProfile()"
                (keydown.enter)="openProfile()"
                (keydown.space)="$event.preventDefault(); openProfile()"
                [appUserNameStyle]="userProfile()"
                role="button"
                tabindex="0"
                class="mention-chip cursor-pointer"
                >{{ userDisplayName() }}</span
            >{{ parts[1] }}
        } @else {
            {{ text }}
        }
    </span>
</div>
