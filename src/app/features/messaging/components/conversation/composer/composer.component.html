<div class="relative px-4 py-3"
     (dragenter)="attachments.onDragEnter($event)"
     (dragover)="attachments.onDragOver($event)"
     (dragleave)="attachments.onDragLeave()"
     (drop)="attachments.onDrop($event)">

  <!-- Hidden file input -->
  <input #fileInput type="file" multiple class="hidden"
         (change)="onFileInputChange($event)" />

  <!-- Suggestion overlay (mentions + commands) -->
  <app-suggestion-overlay
    [overlayType]="overlayType()"
    [filteredFriends]="filteredFriends()"
    [filteredCommands]="filteredCommands()"
    [filteredEmojis]="filteredEmojis()"
    [selectedIndex]="selectedIndex()"
    [query]="query()"
    (mentionSelected)="onMentionSelected($event)"
    (commandSelected)="onCommandSelected($event)"
    (emojiSelected)="onEmojiShortcodeSelected($event)" />

  <!-- Active command hint bar -->
  @if (activeCommand()) {
    <div class="flex items-center gap-2 mb-2 px-1">
      <span class="text-[11px] font-bold text-indigo-400">/ {{ activeCommand()!.name }}</span>
      <span class="text-[11px] text-white/30">—</span>
      <span class="text-[11px] text-white/30">{{ activeCommand()!.description }}</span>
      <button
        (click)="activeCommand.set(null)"
        class="ml-auto text-[11px] text-white/20 hover:text-white/50 border-0 bg-transparent cursor-pointer transition-colors p-0">
        ✕ cancel
      </button>
    </div>
  }

  <!-- Input row -->
  <div class="relative flex flex-col bg-white/[0.05] border border-white/[0.08] rounded-2xl focus-within:border-white/[0.15] transition-colors">

    <!-- Drop overlay -->
    @if (attachments.isDraggingOver()) {
      <div class="absolute inset-0 rounded-2xl bg-indigo-500/10 border-2 border-dashed border-indigo-500/40 flex items-center justify-center z-10 pointer-events-none">
        <div class="flex flex-col items-center gap-1.5">
          <i class="pi pi-upload text-indigo-400 text-lg"></i>
          <p class="text-xs text-indigo-400/70">Drop files here</p>
        </div>
      </div>
    }

    <!-- Attachment previews -->
    <app-attachment-previews
      [files]="attachments.files()"
      (remove)="attachments.remove($event)" />

    <!-- Text + action row -->
    <div class="flex items-end gap-2 px-2 py-1.5">

      <p-button icon="pi pi-plus" [text]="true" severity="secondary" size="small"
                styleClass="shrink-0 self-end mb-0.5" (onClick)="onAttachClick()" />

      <div
        #editor
        contenteditable="true"
        role="textbox"
        aria-multiline="true"
        [attr.data-placeholder]="placeholder()"
        class="composer-editor flex-1 min-w-0 py-1.5 max-h-[160px] overflow-y-auto outline-none text-sm text-white/80"
        style="scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.06) transparent;"
        (input)="onInput()"
        (keydown)="onKeydown($event)"
        (paste)="onPaste($event)"
        (click)="onEditorClick()"
        (focus)="onEditorFocus()"
        autofocus
      ></div>

      <div class="flex items-center gap-1 self-end mb-0.5 shrink-0">
        <app-gif-picker-button (gifSelected)="onGifSelected($event)" />
        <app-emoji-picker-button (emojiSelected)="onEmojiSelected($event)" />
        <p-button icon="pi pi-send" [text]="true" severity="primary" size="small" (onClick)="send()" />
      </div>

    </div>
  </div>
</div>
