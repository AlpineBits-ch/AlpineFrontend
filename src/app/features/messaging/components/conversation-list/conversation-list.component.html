<div class="flex flex-col gap-0.5" [@convList]="sortKey()">
  @for (conv of sortedConversations(); track conv.id) {
    @let preview = getPreview(conv);
    @let unread = getUnreadCount(conv.id);

    <div class="relative group/conv">
    <button
      (click)="conversationSelected.emit(conv)"
      [ngClass]="selectedId() === conv.id ? 'bg-white/[0.08]' : 'bg-transparent hover:bg-white/[0.05]'"
      class="w-full flex items-center gap-2.5 px-2 py-2 rounded-xl transition-all cursor-pointer border-0 text-left">

      <div class="relative shrink-0">
        @let member = convUtils.getPartnerMember(conv);
        <app-avatar
          [userId]="member?.userId"
          [label]="member?.cachedUserName?.[0]?.toUpperCase()"
          size="normal" />
        <app-user-status-dot [status]="convUtils.getPartnerStatus(conv)" />
      </div>

      <div class="flex-1 min-w-0">
        <div class="flex items-center justify-between gap-1">
          <span class="text-sm font-medium truncate"
            [ngClass]="selectedId() === conv.id ? 'text-white/90' : 'text-white/65'">
            {{ convUtils.getChatTitle(conv) }}
          </span>
          <div class="flex items-center gap-1.5 shrink-0">
            @if (preview) {
              <span class="text-[10px] text-white/25 group-hover/conv:opacity-0 transition-opacity">{{ previewMessages().get(conv.id)?.[0]?.createdAt | date: 'shortTime' }}</span>
            }
            @if (unread > 0) {
              <span class="min-w-[18px] h-[18px] px-1 rounded-full bg-indigo-500 text-white text-[10px] font-bold flex items-center justify-center">
                {{ unread >= 30 ? '30+' : unread }}
              </span>
            }
          </div>
        </div>

        @if (convUtils.getTypingLabel(conv); as typingLabel) {
          <span class="text-[11px] truncate flex items-center gap-1 text-brand-dim italic">
            <app-typing-dots />
            {{ typingLabel }}
          </span>
        } @else if (preview) {
          <span class="text-[11px] truncate block"
            [ngClass]="unread > 0 ? 'text-white/50 font-medium' : 'text-white/30'">
            <span class="text-white/45">{{ preview.sender }}:</span> {{ preview.text }}
          </span>
        } @else {
          <span class="text-[11px] text-white/20 truncate block italic">No messages yet</span>
        }
      </div>

    </button>

    <button
      (click)="deleteConversation(conv, $event)"
      class="absolute top-1/2 -translate-y-1/2 right-1.5 w-5 h-5 rounded flex items-center justify-center
             text-white/30 hover:text-rose-400 hover:bg-rose-500/10 border-0 bg-transparent
             opacity-0 group-hover/conv:opacity-100 transition-all cursor-pointer z-10"
      title="Delete conversation">
      <i class="pi pi-times text-[9px]"></i>
    </button>
    </div>
  }

  @if (conversationStore.hasMore()) {
    <button
      (click)="conversationStore.loadMore()"
      class="w-full text-center text-[11px] text-white/30 hover:text-white/55 py-2 cursor-pointer border-0 bg-transparent transition-colors">
      @if (conversationStore.loading()) { Loading… } @else { Load more }
    </button>
  }
</div>
