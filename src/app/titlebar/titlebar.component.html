@if (isTauri()) {
    <div (dblclick)="toggleMaximize()" class="titlebar" data-tauri-drag-region>

        @if (isMac()) {
            <!-- macOS: traffic lights on the left -->
            <div (mouseenter)="macHover = true"
                 (mouseleave)="macHover = false"
                 [class.mac-hover]="macHover"
                 class="mac-controls">
                <button (click)="close()" class="dot dot-close" title="Close"></button>
                <button (click)="minimize()" class="dot dot-minimize" title="Minimize"></button>
                <button (click)="toggleMaximize()" class="dot dot-maximize" title="Zoom"></button>
            </div>
        }

        <div class="identity" data-tauri-drag-region>
            <div class="logo-mark">A</div>
            <span class="app-name">Venta</span>
        </div>

        <div class="grow" data-tauri-drag-region></div>

        @if (!isMac()) {
            <div class="win-controls">
                <button (click)="minimize()" aria-label="Minimize" class="win-btn" title="Minimize">
                    <svg fill="none" height="1" viewBox="0 0 10 1" width="10">
                        <rect fill="currentColor" height="1.2" rx="0.6" width="10"/>
                    </svg>
                </button>
                <button (click)="toggleMaximize()"
                        [attr.aria-label]="isMaximized() ? 'Restore' : 'Maximize'"
                        [title]="isMaximized() ? 'Restore' : 'Maximize'"
                        class="win-btn">
                    @if (isMaximized()) {
                        <!-- Restore icon -->
                        <svg fill="none" height="10" viewBox="0 0 10 10" width="10">
                            <path d="M1 3H7V9H1V3Z" stroke="currentColor" stroke-width="1.1"/>
                            <path d="M3 1H9V7" stroke="currentColor" stroke-linecap="square" stroke-width="1.1"/>
                        </svg>
                    } @else {
                        <!-- Maximize icon -->
                        <svg fill="none" height="10" viewBox="0 0 10 10" width="10">
                            <rect height="8.9" rx="0.2" stroke="currentColor" stroke-width="1.1" width="8.9" x="0.55"
                                  y="0.55"/>
                        </svg>
                    }
                </button>
                <button (click)="close()" aria-label="Close" class="win-btn win-close" title="Close">
                    <svg fill="none" height="10" viewBox="0 0 10 10" width="10">
                        <path d="M1.5 1.5L8.5 8.5M8.5 1.5L1.5 8.5" stroke="currentColor" stroke-linecap="round"
                              stroke-width="1.2"/>
                    </svg>
                </button>
            </div>
        }

    </div>
}
