<div class="stack">
  @for (item of toast.toasts(); track item.id) {
    <div class="toast"
         [class.toast--leaving]="item.leaving"
         [class.toast--clickable]="item.onClick"
         (click)="handleClick(item)">

      <div class="avatar">
        @if (item.avatarUrl) {
          <img class="avatar__img" [src]="item.avatarUrl" [alt]="item.title" />
        } @else {
          <div class="avatar__fallback">{{ avatarLetter(item) }}</div>
        }
      </div>

      <div class="content">
        <div class="title">{{ item.title }}</div>
        @if (item.body) {
          <div class="body">{{ item.body }}</div>
        }
      </div>

      <button class="close" (click)="closeClick(item.id, $event)" aria-label="Dismiss">
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
          <path d="M1.5 1.5L8.5 8.5M8.5 1.5L1.5 8.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
      </button>

      @if (item.duration > 0) {
        <div class="progress" [style.animation-duration.ms]="item.duration"></div>
      }
    </div>
  }
</div>
