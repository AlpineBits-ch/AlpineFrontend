# Server block for the public web client image (see ../../.github/workflows/web-client-image.yml).
# Mounted over nginx:alpine's stock /etc/nginx/conf.d/default.conf.
#
# Modelled on docker/e2e/nginx.conf, which serves the same Angular output to the E2E suite. The
# differences are all consequences of this one being reachable by real users on the public internet
# with real key material in IndexedDB:
#
#   * the security headers in security-headers.conf, chiefly the CSP;
#   * an explicit application/wasm type and a cache policy that distinguishes hashed bundles from
#     the unhashed assets the wasm engine ships as;
#   * a per-response CSP nonce substituted into the HTML.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Version banners on 404 pages and in the Server header tell an attacker which nginx CVEs to
    # try. Nothing needs them.
    server_tokens off;

    # Both files are generated at container start by /docker-entrypoint.d/40-render-csp.sh from
    # $VENTA_API_HOSTS. security-headers.conf carries the CSP with `connect-src` rendered;
    # venta-runtime.conf is one `set $venta_api_hosts "..."` holding the same host list for the
    # <meta> tag below. Neither exists in the source tree - see security-headers.conf.template.
    include /etc/nginx/venta-runtime.conf;

    # Inherited by any location that does not declare an `add_header` of its own. The ones that do
    # re-include the file - see the inheritance note at the top of security-headers.conf.template,
    # which is the reason every include below looks redundant and is not.
    include /etc/nginx/security-headers.conf;

    # The whole reason a config file exists at all. Angular routes are client-side only: nginx has
    # no /guilds/123 on disk, so without this every reload and every link opened directly - which
    # is how a user arrives at a shared message - answers 404.
    #
    # The final argument is an internal redirect, so it re-enters location matching and lands in
    # `location = /index.html` below. That is load-bearing rather than incidental: it is what gives
    # a deep link the same no-store header and the same nonce substitution as a request for / does.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html is the only unhashed entry point, so it must never be cached - a stale one pins
    # the whole app to a previous build's chunk names, which surfaces as chunk 404s that look like
    # a broken deployment rather than a caching problem.
    #
    # `no-store` is doubly required here, and the second reason is the more serious one: the CSP
    # nonce below is per-response, and every response embeds it in both the header and the markup.
    # A cached copy of this document would pair yesterday's markup with today's header, every
    # <style> block in it would be refused, and the app would render with no styling at all. If
    # this ever needs to be cacheable, the nonce mechanism has to go first.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store, must-revalidate" always;

        # The nonce, injected into the two things that need it.
        #
        # `$request_id` is 16 random bytes rendered as hex, generated once per request and stable
        # across the internal redirect from `try_files`, so the value substituted here is the same
        # one the Content-Security-Policy header carries.
        #
        #   <style>          - both blocks in the built index.html: the loading spinner from
        #                      src/index.html, and the critical CSS Beasties inlines during the
        #                      production build. `sub_filter_once off` is what makes it both
        #                      rather than only the first.
        #
        #   <app-root>       - Angular reads `ngCspNonce` off the root element at bootstrap and
        #                      then stamps it onto every <style> element it injects for component
        #                      styles at runtime. Without it those are refused and the app loads
        #                      with global styles only, which looks like a half-broken theme
        #                      rather than a policy violation. Injecting the attribute here rather
        #                      than writing it into src/index.html keeps the desktop build - which
        #                      has no CSP and no nginx - completely unaffected.
        #
        # Both substitutions are asserted against the real built HTML in the workflow before the
        # image is pushed, because a sub_filter that matches nothing does not error: it just
        # serves the document unchanged, and the failure would appear as unstyled UI in
        # production.
        # The permitted API hosts, published to the app.
        #
        # The client needs to know which servers it is allowed to reach, because on web the
        # federation server picker must not offer an origin the CSP will refuse - a user who picks
        # one gets a login that fails with nothing in the UI to explain it. This meta tag is that
        # source of truth, and it is deliberately the *same* string 40-render-csp.sh built
        # connect-src from, so the list the UI offers cannot drift from the list the browser
        # enforces.
        #
        # A meta tag rather than a /config.json the app fetches: it is already here in the document
        # nginx is rewriting, so it costs no extra request and - the part that matters - it is
        # present before Angular bootstraps, so the picker never has a window where it does not yet
        # know the answer.
        #
        # `<base href="/">` is the anchor because Angular requires it, it is in <head>, and the
        # build emits it verbatim. Space-separated origins; the client half is a separate change.
        # No `sub_filter_types`: it already defaults to text/html, and restating it makes
        # `nginx -t` warn about a duplicate MIME type - a warning in the output of the very command
        # the Dockerfile runs to prove this config is clean.
        sub_filter_once off;
        sub_filter '<base href="/">' '<base href="/"><meta name="venta-api-hosts" content="$venta_api_hosts">';
        sub_filter '<style>' '<style nonce="$request_id">';
        sub_filter '<app-root></app-root>' '<app-root ngCspNonce="$request_id"></app-root>';
    }

    # ── Unhashed assets: everything angular.json copies out of src/assets ──────────────────────
    #
    # Angular's `outputHashing: all` hashes bundles, not copied assets, so nothing under /assets/
    # carries a content hash - not the wasm engine, not the i18n JSON, not the branding SVGs.
    # Caching them the way the hashed bundles are cached would be a real bug rather than an
    # inefficiency: a shipped fix to the crypto engine or a corrected translation would never
    # reach a browser that had already loaded the old one, for a year, with no way to invalidate
    # it. `max-age=0, must-revalidate` costs a conditional request and answers 304, which for
    # files this size is the right trade.
    #
    # This is a prefix location, so it takes precedence over the hashed-bundle regex further down
    # that would otherwise match /assets/wasm/venta_crypto.js and /assets/i18n/locales/en.json.
    location ^~ /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;

        # The wasm MIME type, forced rather than assumed.
        #
        # `WebAssembly.instantiateStreaming` rejects anything that is not served as
        # application/wasm, and it does so with a message about an incorrect response MIME type
        # that reads, at a glance, like a corrupt or truncated binary - so the wrong type here
        # costs an afternoon of looking at the wasm build. Recent nginx does ship application/wasm
        # in its default mime.types, but relying on what the base image happens to include is
        # exactly the class of assumption this repository's CI comments argue against, and the
        # cost of being explicit is three lines.
        #
        # An empty `types { }` plus `default_type` is the idiomatic way to force one type inside a
        # location: a non-empty `types` block at this level would *replace* the inherited mime map
        # rather than extend it, which would leave every other file in the directory as
        # application/octet-stream.
        location ~* \.wasm$ {
            include /etc/nginx/security-headers.conf;
            types { }
            default_type application/wasm;
            add_header Cache-Control "public, max-age=0, must-revalidate" always;
            gzip_types application/wasm;
        }
    }

    # The Twemoji sprite sheet, copied from a pinned node_modules path and unhashed like the
    # assets above - but it only changes on an emoji-datasource-twitter bump, and it is large
    # enough that revalidating it on every navigation is worth avoiding. A month, not a year, and
    # not `immutable`, so a bump does eventually propagate on its own.
    location ^~ /emoji-sheets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # Belt and braces. The build passes --source-map=false and the workflow and Dockerfile both
    # fail if a .map survives, but if one ever did reach this image it must not be reachable over
    # HTTP: Angular's maps embed `sourcesContent`, i.e. this repository's complete TypeScript, and
    # this server is public. Placed above the hashed-bundle regex because nginx tries regex
    # locations in order.
    location ~ \.map$ {
        access_log off;
        return 404;
    }

    # Hashed build output: the root-level bundles and the fonts under media/. Everything reaching
    # this regex carries a content hash (angular.json sets outputHashing: all on the production
    # configuration), so it is safe to cache immutably - the unhashed paths were claimed by the
    # prefix locations above, which outrank this.
    #
    # One `add_header` rather than the `expires 1y;` + `add_header Cache-Control "public,
    # immutable"` pair that docker/e2e/nginx.conf uses: `expires` emits its own Cache-Control, so
    # that combination sends the header twice with different values. Harmless for an ephemeral E2E
    # container, not something to serve to real caches.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|webp|ico)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Container health, for orchestrators and `docker compose up --wait`. Deliberately not
    # /health: that path belongs to the API in a combined deployment, and confusing the two makes
    # a misrouted gateway look healthy.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # The initial bundle is ~5 MB raw, so this is not a micro-optimisation. application/wasm is in
    # the list because the engine compresses well and every first load pays for it; the browser
    # decompresses before the wasm stream, so instantiateStreaming is unaffected.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 1024;
    # Vary: Accept-Encoding, so a shared cache cannot hand a gzipped body to a client that did not
    # ask for one.
    gzip_vary on;
}
