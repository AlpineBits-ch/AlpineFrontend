# Server block for the source-free E2E client image (see ../../.github/workflows/
# e2e-client-image.yml). Mounted over nginx:alpine's stock /etc/nginx/conf.d/default.conf.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The whole reason this file exists. Angular routes are client-side only: nginx has no
    # /guilds/123 on disk, so without this every reload and every direct navigation in a
    # Playwright test - which is how a test opens a page, it does not click its way there from
    # / - answers 404 and the suite fails on a blank page rather than on the thing under test.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Belt and braces. The build passes --source-map=false and the workflow fails if a .map
    # survives, but if one ever does reach this image it must not be reachable over HTTP:
    # a Playwright trace records network responses, and the E2E repo is public. A regex
    # location outranks the prefix location above, so this wins.
    location ~ \.map$ {
        access_log off;
        return 404;
    }

    # Container health, for `docker compose up --wait` on the E2E side. Deliberately not /health:
    # that path belongs to the backend in the compose topology and confusing the two makes a
    # misrouted gateway look healthy.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # index.html is the only unhashed entry point, so it must never be cached - a stale one
    # pins the whole app to a previous build's chunk names, which surfaces as chunk 404s that
    # look like a broken image rather than a caching problem.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Everything else carries a content hash (angular.json sets outputHashing: all on the
    # production configuration), so it is safe to cache immutably.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|webp|json)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The initial bundle is ~5 MB raw. Every Playwright page load pays for it, so this is not a
    # micro-optimisation; it is roughly a five-fold reduction on the dominant transfer in the run.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
