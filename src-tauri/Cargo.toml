[package]
name = "alpine"
version = "3.0.65"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
license = "MIT"
default-run = "alpine"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "alpine_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "bench-screen"
path = "src/bin/bench_screen.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [ "devtools"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
sysinfo = "0.38.4"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-single-instance = "2"
tauri-plugin-os = "2"
openmls = "0.8.1"
openmls_rust_crypto = "0.5"
openmls_basic_credential = { version = "0.5", features = ["test-utils"] }
argon2 = "0.5.3"
base64 = "0.22"
aes-gcm = "0.10.3"
rsa = { version = "0.9", features = ["sha2"] }
rand = "0.8"
uuid = { version = "1.0", features = ["v4"] }
tauri-plugin-store = "2.0.0"
tauri-plugin-secure-storage = "1.5.0"

# Android
[target.aarch64-linux-android.dependencies]
tauri-plugin-notifications = { version = "0.4.6", features = ["push-notifications"] }

[target.armv7-linux-androideabi.dependencies]
tauri-plugin-notifications = { version = "0.4.6", features = ["push-notifications"] }

[target.i686-linux-android.dependencies]
tauri-plugin-notifications = { version = "0.4.6", features = ["push-notifications"] }

[target.x86_64-linux-android.dependencies]
tauri-plugin-notifications = { version = "0.4.6", features = ["push-notifications"] }

# iOS (device)
[target.aarch64-apple-ios.dependencies]
tauri-plugin-notifications = { version = "0.4.6", features = ["push-notifications"] }

# iOS Simulator (Apple Silicon Mac)
[target.aarch64-apple-ios-sim.dependencies]
tauri-plugin-notifications = { version = "0.4.6", features = ["push-notifications"] }

# iOS Simulator (Intel Mac)
[target.x86_64-apple-ios.dependencies]
tauri-plugin-notifications = { version = "0.4.6", features = ["push-notifications"] }

[dev-dependencies]

[profile.release.package.wry]
debug = true
debug-assertions = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
cpal = "0.15"
xcap = "0.9"
nnnoiseless = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
jpeg-encoder = "0.6"
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }

[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-notifications = { version = "0.4.6", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
tauri-plugin-notifications = "0.4.6"

[target.'cfg(target_os = "windows")'.dependencies]
tauri-plugin-notifications = "0.4.6"
windows = { version = "0.58", features = [
    "implement",
    "Foundation",
    "Data_Xml_Dom",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell",
] }
windows-core = "0.58"
