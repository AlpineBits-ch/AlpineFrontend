[package]
name = "Venta"
version = "3.0.147"
description = ""
authors = ["you"]
edition = "2021"
license = "MIT"
default-run = "Venta"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "alpine_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "bench-screen"
path = "src/bin/bench_screen.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [ "devtools"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
sysinfo = "0.38.4"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-single-instance = {version = "2", features = ["deep-link"] }
tauri-plugin-os = "2"
openmls = "0.8.1"
openmls_rust_crypto = "0.5"
openmls_basic_credential = { version = "0.5", features = ["test-utils"] }
argon2 = "0.5.3"
base64 = "0.22"
aes-gcm = "0.10.3"
rsa = { version = "0.9", features = ["sha2"] }
rand = "0.8"
uuid = { version = "1.0", features = ["v4"] }
tauri-plugin-store = "2.0.0"
tauri-plugin-secure-storage = "1.5.0"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-deep-link = "2"

# Android
[target.aarch64-linux-android.dependencies]
tauri-plugin-notifications = { version = "0.4.6", features = ["push-notifications"] }

[target.armv7-linux-androideabi.dependencies]
tauri-plugin-notifications = { version = "0.4.6", features = ["push-notifications"] }

[target.i686-linux-android.dependencies]
tauri-plugin-notifications = { version = "0.4.6", features = ["push-notifications"] }

[target.x86_64-linux-android.dependencies]
tauri-plugin-notifications = { version = "0.4.6", features = ["push-notifications"] }

# iOS (device)
[target.aarch64-apple-ios.dependencies]
tauri-plugin-notifications = { version = "0.4.6", features = ["push-notifications"] }

# iOS Simulator (Apple Silicon Mac)
[target.aarch64-apple-ios-sim.dependencies]
tauri-plugin-notifications = { version = "0.4.6", features = ["push-notifications"] }

# iOS Simulator (Intel Mac)
[target.x86_64-apple-ios.dependencies]
tauri-plugin-notifications = { version = "0.4.6", features = ["push-notifications"] }

# Upstream `webrtc-audio-processing-sys` cannot build with MSVC: its build script applies
# `-std=c++17` and `-Wno-unused-parameter` unconditionally, and `cl` rejects the latter outright
# (`D8021`), so Windows could not have echo cancellation at all. The vendored copy adds an MSVC
# branch and nothing else - see the two comments marked `ALPINE PATCH` in its build.rs.
[patch.crates-io]
webrtc-audio-processing-sys = { path = "vendor/webrtc-audio-processing-sys" }

[features]
default = ["aec"]
# Acoustic echo cancellation via WebRTC's AudioProcessing module.
#
# It builds that module from source, which needs meson, ninja and Python on PATH. Because it is on
# by default, so does an ordinary `cargo build` or `tauri build` - the fallback in
# media::voice::process is reached by turning the feature *off*, not by lacking the tools, and a
# machine without them fails the build outright ("Failed to execute meson. Do you have it
# installed?"). CI installs them explicitly; see .github/workflows/build.yml.
#
# Build without echo cancellation - and without those tools - via --no-default-features.
aec = ["dep:webrtc-audio-processing"]

[dev-dependencies]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-global-shortcut = "2"
cpal = "0.15"
xcap = "0.9"
nnnoiseless = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
jpeg-encoder = "0.6"
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
webrtc = "0.14"
# `libloading`, never `source`. Building OpenH264 from source produces a binary Cisco never
# licensed, and the BSD source licence grants copyright but not patent rights. Only Cisco's own
# precompiled binary carries their MPEG-LA royalty coverage, so it is fetched at runtime and loaded
# dynamically -see media::publisher::openh264_blob.
openh264 = { version = "0.9", default-features = false, features = ["libloading"] }
bzip2-rs = "0.1"
sha2 = "0.10"

# ── Voice pipeline (media::voice) ─────────────────────────────────────────────
# Band-limited resampling. Replaces the linear interpolator in media::audio, which had no
# anti-aliasing filter at all, so a 44.1 kHz microphone folded its top octave into the voice band.
rubato = "4"
audioadapter-buffers = "4"
# Opus, configured for VoIP with in-band FEC and DTX - see media::voice::codec.
opus = "0.3"
# HRTF panning for Isle proximity voice. The crate ships no impulse-response data; the sphere is
# supplied separately. See media::voice::mixer.
hrtf = "0.8"
# A lock-free single-producer/single-consumer ring, for the hop between the cpal callback and the
# capture thread. Hand-rolling this means hand-rolling the unsafe; this crate is the standard choice
# for exactly this job and allocates only when constructed. See media::voice::ring.
ringbuf = "0.4"
# Echo cancellation, noise suppression and gain control. Optional because it builds a C++ library
# with meson, and the toolchain is not present everywhere - a machine without it builds the
# passthrough processor and loses echo cancellation rather than losing voice.
# See media::voice::process.
webrtc-audio-processing = { version = "2.1", features = ["bundled"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-notifications = { version = "0.4.6", default-features = false }
nokhwa = { version = "0.10", default-features = false, features = ["input-avfoundation"] }

[target.'cfg(target_os = "linux")'.dependencies]
tauri-plugin-notifications = "0.4.6"
nokhwa = { version = "0.10", default-features = false, features = ["input-v4l"] }

[target.'cfg(target_os = "windows")'.dependencies]
tauri-plugin-notifications = "0.4.6"
nokhwa = { version = "0.10", default-features = false, features = ["input-msmf"] }
windows = { version = "0.58", features = [
    "Win32_Media_MediaFoundation",
    "Win32_Media_KernelStreaming",
    "implement",
    "Foundation",
    "Data_Xml_Dom",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }
windows-core = "0.58"
