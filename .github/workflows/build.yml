name: Build & Release

on:
  push:
    branches: [release]

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.VERSION }}

    steps:
      - uses: actions/checkout@v4

      - name: Get app version
        id: version
        run: echo "VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)" >> $GITHUB_OUTPUT

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Alpine v${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
          make_latest: true

  # Platform-independent gates, deliberately in their own job rather than inside a build.
  #
  # These used to run in release-windows, on the grounds that their output is the same everywhere so
  # they only need to run once. That part was right; the placement was not - "once" landed on the
  # slowest job in the workflow, so a ~90s check that has nothing to do with Windows sat directly on
  # the critical path of the release. Here it runs concurrently with both builds and finishes long
  # before either, so it costs no wall-clock at all.
  #
  # `needs:` is deliberately absent. This does not gate create-release: it never did (the release was
  # already published by the time the Windows job reached these checks), and making it a gate would
  # serialise a couple of minutes in front of every build to preserve a property the workflow has
  # never had. A failure here still fails the run, which is the actual point.
  #
  # No submodules: the i18n locales are a frontend asset, and nothing these scripts read lives there.
  # The vendored WebRTC notices that generate-notices.js does read are committed to this repo, not
  # pulled in as a submodule.
  checks:
    name: Platform-independent checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      # generate-notices.js shells out to `cargo metadata` for the Rust half of the dependency tree.
      # Resolution only - nothing is compiled here, so no sccache and no system dependencies.
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache bun package cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Fails if a dependency was added without regenerating the notices.
      - name: Check third-party notices are up to date
        run: |
          bun run licenses:test
          bun run licenses
          if ! git diff --quiet -- src/assets/THIRD-PARTY-NOTICES.md; then
            git diff -- src/assets/THIRD-PARTY-NOTICES.md
            echo "::error::THIRD-PARTY-NOTICES.md is stale - run 'bun run licenses' and commit the result."
            exit 1
          fi

      # The NSIS template is vendored (src-tauri/vendor/nsis/installer.nsi) so the installer can
      # default to a passive, wizard-less install. A vendored handlebars template can drift from the
      # bundler that consumes it on any CLI bump, producing a subtly wrong installer rather than a
      # build failure - this makes that loud. The check only reads files, so it does not need
      # Windows despite guarding a Windows-only artifact.
      - name: Check the vendored NSIS template is in sync
        run: bun run nsis:check

  release-windows:
    needs: create-release
    environment: build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - name: Disable Windows Defender
        run: Set-MpPreference -DisableRealtimeMonitoring $true
        shell: powershell
      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      # Deliberately sccache alone, not sccache + swatinem/rust-cache. Both store into the same
      # 10 GB GitHub Actions cache, so they evict each other, and rust-cache saved a multi-gigabyte
      # Tauri target/ directory on every run - paying the upload cost each time while rarely
      # getting a hit. sccache's per-object entries are far smaller and survive the budget.
      - uses: mozilla-actions/sccache-action@v0.0.10
      - name: Force HTTPS for Submodules
        run: |
          git config --global url."https://github.com/".insteadOf "git@github-alpine:"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
      - name: Update Submodules
        run: |
          git submodule update --init --recursive

      # The `aec` feature is on by default and builds WebRTC's AudioProcessing module from source
      # through meson and ninja (see src-tauri/Cargo.toml). Installed explicitly rather than relying
      # on whatever the runner image happens to ship, so echo cancellation cannot silently stop
      # building because an image changed. Python, which meson needs, is preinstalled.
      #
      # The MSVC toolchain this then drives is set up by the runner itself; meson only finds `cl`
      # because of that. A plain developer shell has no MSVC on PATH and fails here with an
      # unhelpful "[WinError 2]" out of meson - run from an "x64 Native Tools" prompt locally.
      - name: Install meson and ninja
        run: pip install meson ninja

      # setup-bun caches the bun binary, not the packages. `bun install` on this runner was ~1m43s
      # against ~5s on ubuntu, which is what makes the package cache worth its slot in the shared
      # 10 GB budget here even though it barely registers on Linux.
      - name: Cache bun package cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # ~41 MB, and it takes the production frontend build from roughly a minute cold to ~16s warm -
      # measured in ci.yml, which has had this for a while. `tauri build` runs `bun run build` as its
      # beforeBuildCommand, so the release jobs pay that cold cost too; they were just never given
      # the cache. Keyed on bun.lock rather than the commit sha for the reason spelled out in ci.yml:
      # a per-commit key writes a fresh entry every run and evicts the caches that matter.
      - name: Cache Angular build cache
        uses: actions/cache@v4
        with:
          path: .angular/cache
          key: angular-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: angular-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Tauri (Windows)
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # No SENTRY_AUTH_TOKEN here, deliberately. `bun run build` uploads frontend sourcemaps, and
          # both release jobs build the identical frontend - so passing the token on both uploaded
          # the same maps to the same Sentry release twice, the second upload being pure duplicate
          # work on the job that gates the release. release-linux is the uploader now.
          #
          # scripts/sentry-sourcemaps.mjs skips cleanly when the token is absent rather than failing,
          # so this omission is the whole mechanism - there is no second switch to keep in sync.
        # NSIS only, deliberately - the MSI is not a second flavour of the same
        # thing, it is a different install with a different location and a
        # different privilege model.
        #
        # NSIS is configured `currentUser` (see tauri.conf.json), so it installs
        # into %LOCALAPPDATA%\Venta with no UAC prompt and the updater can install
        # it silently with `/S /R`. The MSI installs per-machine into Program
        # Files and needs elevation for every update; under the updater's `quiet`
        # install mode the UAC prompt is suppressed and the install fails
        # silently. The updater also prefers `{os}-{arch}-{installer}` over
        # `{os}-{arch}`, so as long as an msi artifact exists and the API
        # advertises it, MSI-installed clients keep being served the broken path.
        #
        # Not building it is what makes that unreachable.
        run: bun run tauri build --bundles nsis

      - name: Upload Windows artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          fail_on_unmatched_files: false
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig

  release-linux:
    needs: create-release
    environment: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      # See the note in release-windows: sccache alone, not alongside rust-cache.
      - uses: mozilla-actions/sccache-action@v0.0.10
      - name: Force HTTPS for Submodules
        run: |
          git config --global url."https://github.com/".insteadOf "git@github-alpine:"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
      - name: Update Submodules
        run: |
          git submodule update --init --recursive
      # meson, ninja-build: the `aec` feature is on by default and builds WebRTC's AudioProcessing
      # module from source through them (see src-tauri/Cargo.toml), which is what this job was
      # failing on.
      #
      # pkg-config: the build script probes for a system abseil (>= 20240722) before falling back to
      # the copy meson fetches. Ubuntu's is older than that, so the fallback is what actually gets
      # used, but without pkg-config the probe cannot even run.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libpipewire-0.3-dev \
            libsoup-3.0-dev \
            libgbm-dev \
            libasound2-dev \
            patchelf \
            meson \
            ninja-build \
            pkg-config

      # Same two caches as release-windows, and they share their keys with ci.yml's frontend job -
      # whichever runs first populates them, the rest restore. See the notes over there for why the
      # key is bun.lock rather than the commit sha.
      - name: Cache bun package cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Cache Angular build cache
        uses: actions/cache@v4
        with:
          path: .angular/cache
          key: angular-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: angular-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Tauri (Linux)
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # The only job that uploads frontend sourcemaps - see the note in release-windows. If this
          # job is ever dropped or made conditional, the token has to move rather than just vanish,
          # or releases stop being symbolicated in Sentry without anything failing.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: bun run tauri build --bundles deb,rpm

      - name: Upload Linux artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          fail_on_unmatched_files: false
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/*.deb.sig
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/rpm/*.rpm.sig
