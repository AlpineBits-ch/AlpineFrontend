name: Build & Release

on:
  push:
    branches: [release]

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.VERSION }}

    steps:
      - uses: actions/checkout@v4

      - name: Get app version
        id: version
        run: echo "VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)" >> $GITHUB_OUTPUT

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Alpine v${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
          make_latest: true


  release-windows:
    needs: create-release
    environment: build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - name: Disable Windows Defender
        run: Set-MpPreference -DisableRealtimeMonitoring $true
        shell: powershell
      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      # Deliberately sccache alone, not sccache + swatinem/rust-cache. Both store into the same
      # 10 GB GitHub Actions cache, so they evict each other, and rust-cache saved a multi-gigabyte
      # Tauri target/ directory on every run - paying the upload cost each time while rarely
      # getting a hit. sccache's per-object entries are far smaller and survive the budget.
      - uses: mozilla-actions/sccache-action@v0.0.10
      - name: Force HTTPS for Submodules
        run: |
          git config --global url."https://github.com/".insteadOf "git@github-alpine:"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
      - name: Update Submodules
        run: |
          git submodule update --init --recursive

      # The `aec` feature is on by default and builds WebRTC's AudioProcessing module from source
      # through meson and ninja (see src-tauri/Cargo.toml). Installed explicitly rather than relying
      # on whatever the runner image happens to ship, so echo cancellation cannot silently stop
      # building because an image changed. Python, which meson needs, is preinstalled.
      #
      # The MSVC toolchain this then drives is set up by the runner itself; meson only finds `cl`
      # because of that. A plain developer shell has no MSVC on PATH and fails here with an
      # unhelpful "[WinError 2]" out of meson - run from an "x64 Native Tools" prompt locally.
      - name: Install meson and ninja
        run: pip install meson ninja

      - name: Install dependencies
        run: bun install

      # Fails if a dependency was added without regenerating the notices. The output is
      # platform-independent by construction, so this check is only run once, here.
      #
      # Spelled out rather than `git diff --exit-code ... || (echo ... && exit 1)`. This step runs
      # under PowerShell, where `&&` chains *commands* and `exit` is a language keyword, so the
      # shorthand died with "The term 'exit' is not recognized as a name of a cmdlet" - masking
      # whichever result the diff had actually produced.
      #
      # `--name-only` rather than `--exit-code` for the same class of reason: Actions runs this with
      # `$ErrorActionPreference = 'stop'`, and pwsh 7.4 turns a non-zero native exit code into a
      # terminating error, which would kill the step before the message below ever printed. This
      # form always exits 0 and reports through its output instead.
      - name: Check third-party notices are up to date
        run: |
          bun run licenses:test
          bun run licenses
          $stale = git diff --name-only -- src/assets/THIRD-PARTY-NOTICES.md
          if ($stale) {
            git diff -- src/assets/THIRD-PARTY-NOTICES.md
            Write-Output "::error::THIRD-PARTY-NOTICES.md is stale - run 'bun run licenses' and commit the result."
            exit 1
          }

      - name: Build Tauri (Windows)
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: bun run tauri build --bundles nsis,msi

      - name: Upload Windows artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          fail_on_unmatched_files: false
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig

  release-linux:
    needs: create-release
    environment: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      # See the note in release-windows: sccache alone, not alongside rust-cache.
      - uses: mozilla-actions/sccache-action@v0.0.10
      - name: Force HTTPS for Submodules
        run: |
          git config --global url."https://github.com/".insteadOf "git@github-alpine:"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
      - name: Update Submodules
        run: |
          git submodule update --init --recursive
      # meson, ninja-build: the `aec` feature is on by default and builds WebRTC's AudioProcessing
      # module from source through them (see src-tauri/Cargo.toml), which is what this job was
      # failing on.
      #
      # pkg-config: the build script probes for a system abseil (>= 20240722) before falling back to
      # the copy meson fetches. Ubuntu's is older than that, so the fallback is what actually gets
      # used, but without pkg-config the probe cannot even run.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libpipewire-0.3-dev \
            libsoup-3.0-dev \
            libgbm-dev \
            libasound2-dev \
            patchelf \
            meson \
            ninja-build \
            pkg-config

      - name: Install dependencies
        run: bun install

      - name: Build Tauri (Linux)
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: bun run tauri build --bundles deb,rpm

      - name: Upload Linux artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          fail_on_unmatched_files: false
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/*.deb.sig
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/rpm/*.rpm.sig
