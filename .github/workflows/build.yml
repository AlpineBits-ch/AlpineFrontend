name: Build & Release

on:
  push:
    branches: [release]

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.VERSION }}

    steps:
      - uses: actions/checkout@v4

      - name: Get app version
        id: version
        run: echo "VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)" >> $GITHUB_OUTPUT

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Alpine v${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
          make_latest: true


  release-windows:
    needs: create-release
    environment: build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - name: Disable Windows Defender
        run: Set-MpPreference -DisableRealtimeMonitoring $true
        shell: powershell
      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      # Deliberately sccache alone, not sccache + swatinem/rust-cache. Both store into the same
      # 10 GB GitHub Actions cache, so they evict each other, and rust-cache saved a multi-gigabyte
      # Tauri target/ directory on every run - paying the upload cost each time while rarely
      # getting a hit. sccache's per-object entries are far smaller and survive the budget.
      - uses: mozilla-actions/sccache-action@v0.0.10
      - name: Force HTTPS for Submodules
        run: |
          git config --global url."https://github.com/".insteadOf "git@github-alpine:"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
      - name: Update Submodules
        run: |
          git submodule update --init --recursive

      # The `aec` feature is on by default and builds WebRTC's AudioProcessing module from source,
      # which shells out to meson and ninja (see src-tauri/Cargo.toml). Installed explicitly rather
      # than relying on whatever the runner image happens to ship, so echo cancellation cannot
      # silently stop building because an image changed. Python, which meson needs, is preinstalled.
      - name: Install meson and ninja
        run: pip install meson ninja

      - name: Install dependencies
        run: bun install

      - name: Build Tauri (Windows)
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: bun run tauri build --bundles nsis,msi

      - name: Upload Windows artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          fail_on_unmatched_files: false
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig

  release-linux:
    needs: create-release
    environment: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      # See the note in release-windows: sccache alone, not alongside rust-cache.
      - uses: mozilla-actions/sccache-action@v0.0.10
      - name: Force HTTPS for Submodules
        run: |
          git config --global url."https://github.com/".insteadOf "git@github-alpine:"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
      - name: Update Submodules
        run: |
          git submodule update --init --recursive
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libpipewire-0.3-dev \
            libsoup-3.0-dev \
            libgbm-dev \
            libasound2-dev \
            patchelf \
            meson \
            ninja-build \
            pkg-config

      - name: Install dependencies
        run: bun install

      - name: Build Tauri (Linux)
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: bun run tauri build --bundles deb,rpm

      - name: Upload Linux artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          fail_on_unmatched_files: false
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/*.deb.sig
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/rpm/*.rpm.sig
